name: verify

# 크로스플랫폼 검증. Windows·Linux 를 **실기에서** 돌린다.
#
# 이것이 있는 이유는 하나다 — 개발 호스트가 darwin 이라 Windows 의 WinAPI 호출을
# 손으로 확인할 수 없다 (CROSS_PLATFORM_SRS R-1). 컴파일과 단위 테스트만으로는
# ConPTY·Job Object·toolhelp 가 실제로 도는지 말할 수 없고, 실제로 그 구멍에서
# 결함이 나왔다 (§11).
#
# 그래서 두 층을 돌린다.
#   1. dongminal doctor — 플랫폼 계층을 계층별로 실제 실행 (서버 없이)
#   2. dongminal verify — 격리 인스턴스를 띄워 종단간 표면을 훑는다
# 2번이 중요한 이유는 doctor 가 direct mode 로만 도는 데 반해 실제 서버는
# **데몬 모드**로 돌기 때문이다. 데몬은 끊어 띄운 프로세스이고, §11.6 의 결함이
# 정확히 그 조건에서만 났다.
#
# 두 층 모두 **Go 한 벌**이고 세 대상이 같은 목록을 돈다. 종단간을 bash 와
# PowerShell 로 두 벌 적던 것을 접은 것이다 — 두 벌이면 한쪽만 고쳐지고, 실제로
# 그런 적이 있다 (E2E_UNIFICATION_SRS §2.2 D-3, FR-E2I-1).
#
# verify 는 홈·포트를 받지 않는다. 언제나 임시 홈과 빈 포트에서 돌고 스스로
# 치우므로 별도의 정리 단계가 없다 (FR-E2C-3·FR-E2G-3).

on:
  push:
    branches: [main, crossplatform]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod

      - name: build
        run: go build ./...

      - name: vet
        run: go vet ./...

      # -race 로 돈다 (FR-CAF-3). 이것 없이 돌던 동안 diag 스냅샷 테스트의
      # 경쟁이 CI 를 통과했다 — 검사기가 보지 않는 결함은 없는 것과 같다.
      #
      # `./...` 인 것은 `./web/...` 가 빠져 있었기 때문이다 (05-test TEST-4).
      # `web/embed_test.go`·`web/version_test.go` 가 CI 에서 한 번도 돌지 않았고,
      # 그 패키지의 커버리지가 100% 라는 사실이 그것을 더 잘 감췄다.
      #
      # `-shuffle=on` 은 순서 의존을 드러낸다 (TEST-14). 이 저장소는 테스트
      # 317파일에 `t.Parallel()` 이 0건이라 순서 의존이 숨을 자리가 넓다 —
      # 전역 훅을 교체·복원하는 자리가 여섯 있다(`attention_*_test.go`).
      - name: unit tests
        run: go test -race -shuffle=on ./...

  # 이음매와 크로스 컴파일 게이트 (CROSS_PLATFORM_SRS FR-XBD-2·3).
  #
  # 두 스크립트는 진작 있었는데 **아무도 CI 에 걸지 않았다.** 그래서
  # `runtime.GOOS` 가 platform 밖으로 새어 나간 채로 main 이 초록이었고, 그것을
  # 알아챈 것은 사람이 손으로 스크립트를 돌렸을 때였다. 검사기가 있어도 돌지
  # 않으면 없는 것과 같다.
  #
  # 한 번만 돈다 — 둘 다 호스트에 의존하지 않는다. 이음매 검사는 소스를 훑는
  # 일이고, 크로스 게이트는 GOOS·GOARCH 를 바꿔 가며 build·vet 을 돌리는 일이라
  # 어느 러너에서 돌든 답이 같다. 매트릭스에 태우면 같은 답을 두 번 계산한다.
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      # node 로 쓴 게이트(로드 순서·고정 대기·문구 카탈로그…)는 `espree`·`eslint-scope`
      # 를 import 한다 — `node_modules` 없이는 첫 줄에서 죽는다. M8 P2 가 발견: 이
      # 잡에는 `npm ci` 가 없었다 ("게이트는 두 자리에 들어가야 끝난다" 의 네 번째 사례).
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: 의존
        run: npm ci

      # OS 의존 호출이 internal/shared/platform 밖에 없는가 (FR-XPL-5).
      - name: 이음매
        run: scripts/check-seams.sh

      # 타이머·이벤트 채널이 Scheduler·EventBus 밖에 없는가 (FR-GTE-3).
      - name: 시간과 전파
        run: scripts/check-timers.sh

      # git 쓰기가 전부 gitWrite 파이프라인을 지나는가 (FR-DRC-8).
      - name: git 쓰기 파이프라인
        run: scripts/check-gitwrite.sh

      # 대상 5종에 build 와 vet. vet 이 테스트 파일까지 타입 검사하므로 어느
      # 플랫폼에서만 깨지는 테스트도 여기서 잡힌다.
      - name: 크로스 컴파일
        run: scripts/check-cross.sh

      # 마크업에 이스케이프 없는 값이 끼어드는 자리가 없는가 (02-fe-arch 의 P0).
      # 터미널 출력이 상태바를 지나 문서 컨텍스트의 스크립트가 될 수 있었다 —
      # 이 UI 는 터미널·파일·git 쓰기·설정 API 에 닿으므로 원격 코드 실행에 준한다.
      - name: 마크업 보간
        run: scripts/check-html.sh

      # 브라우저의 API 호출이 전송 한 겹을 지나는가 (CLIENT_API_SRS).
      # 지나지 않는 자리가 하나 생기면 상태 변경의 Content-Type 이 다시 빠지고
      # (요청 게이트가 415 로 막는다), M4 의 401 을 다룰 자리가 흩어진다.
      - name: API 호출의 단일 경로
        run: scripts/check-fetch.sh

      # 숨김의 어휘가 둘인가 — .vis(보임) · [hidden](숨김) (FR-LAY-30).
      # 착수 시 일곱이었고, 그중 `.git-hidden` 은 git 과 무관한 버튼에 붙어 있었다.
      # `[hidden]` 의 UA display:none 은 작성자 규칙에 지므로 네 자리가 각자
      # 되돌려 적고 있었다 — 지금은 한 자리의 !important 가 그것을 대신한다.
      - name: 숨김의 어휘
        run: scripts/check-visibility.sh

      # 스크롤 소유권 — 뷰별 재정의가 없는가 (UI_LAYOUT_DEFAULTS_SRS FR-LAY-31).
      # 이 검사가 없어서 여덟 뷰 중 둘이 명시도가 낮은 선택자로 골격을 적었고,
      # `.git-view.vis` 에 져서 목록이 870px 이상 잘려 닿을 수 없었다. 항목이
      # 적은 픽스처에서는 드러나지 않아 e2e 가 통과하고 있었다 (SRS §2.3).
      - name: 스크롤 소유권
        run: scripts/check-scroll.sh

      # 골격 배치 — inset:0 이 position 과 같은 규칙에 있는가, 그리고 주석이
      # 닫혔는가 (FR-LAY-32). 닫히지 않은 `/*` 뒤의 규칙은 브라우저가 조용히
      # 삼킨다 — 실제로 style.css 끝에 그런 자리가 있었다.
      - name: 골격 배치
        run: scripts/check-skeleton.sh

      # 제3자 자산의 판 기록이 실제 파일과 맞는가 (SEC-32).
      # 기록만 두면 반드시 어긋난다 — 갱신하는 사람은 파일을 덮어쓰지 표를 고치지
      # 않는다. 그러면 취약점 공지가 나왔을 때 "우리가 그 판인가" 에 답할 수 없다.
      - name: 제3자 자산 판 기록
        run: scripts/check-vendor.sh

      # 에이전트 이름의 소유권 (AGENT_ADAPTER_COMPLETION_SRS FR-AAC-31·32).
      #
      # **이 게이트는 CI 에 없었다** (M7 셋째 세션 실측). Makefile 에만 있었고,
      # Makefile 머리말이 금지한 바로 그 상태다 — 로컬에서 잡히는 것을 CI 가 놓치고
      # 그 차이는 밀어 보고 나서야 드러난다. M7 둘째 세션이 같은 부류 둘을 고칠 때
      # 이 하나를 놓쳤다("게이트는 두 자리에 들어가야 끝난다" 의 세 번째 사례).
      - name: 에이전트 이름
        run: scripts/check-agent-names.sh

      # 환경변수 문서 대조 (CONFIG_MANAGEMENT_SRS FR-CFG-18 · M5 `G5-2`).
      #
      # 문서는 **조용히** 낡는다. 이 검사가 없던 동안 여섯이 표 밖에 있었고,
      # 로드맵조차 그 수를 넷으로 세고 있었다. 사람의 눈을 집행자로 두지 않는다.
      - name: 환경변수 문서 대조
        run: scripts/check-env-docs.sh

      # 로그의 단일 경로 (OBSERVABILITY_SRS FR-OBS-5 · M5 `GO-43`/`SEC-24`).
      #
      # 착수 시 `log.Printf` 가 172곳이었다. 한 번 걷어 내는 것은 쉽고 **다시
      # 늘지 않게 하는 것**이 본체다.
      - name: 로그의 단일 경로
        run: scripts/check-logging.sh

      # 오류 응답의 단일 경로 (ERROR_CONTRACT_SRS FR-ERR-3 · M5 `G6-1`).
      # 본문은 그대로 두고 `X-Error-Code` 를 얹는다 — 방언 통일은 파괴적 변경이라
      # 기각돼 있다 (`G6-4`).
      - name: 오류 응답의 단일 경로
        run: scripts/check-http-error.sh

      # 오류 카탈로그가 코드와 맞는가 (FR-ERR-11 · M5 `G6-2`).
      # `docs/external/errors.md` 는 **생성물**이다. 착수 시 코드 47개 중 문서에
      # 있던 것이 7개였다.
      - name: 오류 카탈로그 대조
        run: scripts/check-error-docs.sh

      # ── 문서 대조 넷 (M5 `DOC-1`~`DOC-4` · `G8-1`·`G8-5`) ───────────
      #
      # **문서는 조용히 낡는다.** 이 마일스톤이 그것을 반복해서 만났다 — 로드맵이
      # "`document.title` 대입 0곳" 이라 적은 동안 그것은 이미 구현돼 있었고,
      # `log.Printf` 는 146곳이 아니라 172곳이었으며, `http.Error` 는 63이 아니라
      # 65곳이었다. 세는 사람이 아니라 **CI 가 세게** 만드는 것이 이 넷이다.
      - name: SRS 상태 필드
        run: scripts/check-srs-status.sh

      - name: 결정 색인 대조
        run: scripts/check-decisions.sh

      - name: 명령 문서 대조
        run: scripts/check-commands-docs.sh

      - name: API 문서 대조
        run: scripts/check-api-docs.sh

      - name: 단축키 문서 대조
        run: scripts/check-shortcuts-docs.sh

      # M6 `TEST-6` · APP_TESTING_CONTRACT_SRS FR-ATC-13.
      #
      # 값을 옮기는 것보다 **다시 흩어지지 않게 하는 것**이 본체다 — 착수 시
      # `app._xxx` 가 507회 · 86파일이었고, 그것이 쌓인 이유는 막는 것이 없어서다.
      - name: e2e 의 내부 접근
        run: scripts/check-e2e-private.sh

      # M6 `FE-3` — 스크립트 90개의 **암묵적 로드 순서**.
      #
      # `no-undef` 는 이름의 **존재**를 보고 **시각**을 보지 않는다: 그 규칙이
      # 딛는 전역 목록은 트리 전체에서 뽑으므로 "나중에 로드되는 파일이 선언한다"
      # 와 "지금 선언돼 있다" 를 구분하지 못한다. 스크립트 한 줄을 옮기면 조용히
      # `ReferenceError` 가 나던 자리다 (`02 FE-3`).
      - name: 로드 순서
        run: node scripts/check-load-order.mjs

      # M6 `TEST-16` — **고정 대기는 근거가 있는 예외만**.
      #
      # `waitForTimeout` 은 조건을 보지 않으므로 느린 러너에서 흔들리고 빠른
      # 러너에서 시간을 버린다. `flaky > 0` 이 실패로 승격된 뒤로 그 흔들림은 곧
      # 빨간 빌드다. 다만 재려는 것이 **"일어나지 않음"** 인 자리는 기다릴 신호가
      # 없다 — 그래서 금지가 아니라 근거를 요구한다 (착수 시 247회 · 68파일).
      - name: e2e 의 고정 대기
        run: node scripts/check-e2e-waits.mjs

      # M6 `FE-4` — **계층 역전**. `ui/`·`git/` 이 App 의 `_` 이름을 파고들면
      # App 내부 이름 하나를 바꾸는 것이 세 디렉터리를 깨뜨리고, 그것이 계약을
      # 깬 것인지 남의 내부를 만지다 깨진 것인지 판정할 수 없다. 착수 시
      # `app._xxx` 가 363회 · 이름 148개였고 전부 승격했다
      # (FE_MODULE_BOUNDARY_SRS FR-FMB-40~43).
      - name: 프론트 계층 경계
        run: scripts/check-layer.sh

      # M8 `GO-4`·`GO-48` — **프로세스 축 경계.** `internal/` 은 프로세스 축으로
      # 묶여 있는데 감사 시점에 네 곳이 새어 있었고 문서는 "예외는 없다" 고
      # 적혀 있었다. 축 패키지는 자기 축과 shared/ 만, shared/ 는 shared/ 만
      # import 한다(`go list -deps`). 같은 게이트가 architecture.md 의 패키지
      # 표를 `go list ./...` 과 양방향으로 대조한다.
      - name: 프로세스 축 경계 · 패키지 표
        run: scripts/check-pkg-axis.sh

      # M7 — 접근성 셋. `make gates` 에는 있었고 **여기에는 없었다**: 이 파일과
      # Makefile 의 목록이 갈리면 로컬에서 잡히는 것을 CI 가 놓치고, 그 차이는
      # 밀어 보고 나서야 드러난다 (Makefile 머리말이 세운 규약).
      #
      # 대비 게이트는 `themes.js` 를 고치는 커밋에서 즉시 빨개진다 — 새 테마도
      # 자동으로 검사를 받는다 (DESIGN_TOKENS_SRS FR-TOK-26·27).
      - name: 글자 대비
        run: node scripts/check-contrast.mjs

      # `--bg-alt` 가 이 게이트의 이유다 — 일곱 자리가 읽었고 정의된 적이
      # 없었다. **폴백이 있어도 잡는다**: 폴백은 부재를 숨기고, 숨겨진 채로 두면
      # 폴백을 적지 않은 다음 사람이 빈 값을 얻는다 (FR-TOK-28 / D-TOK-6).
      - name: CSS 토큰
        run: node scripts/check-css-vars.mjs

      # `UX-13` — 착수 시 `outline:none` 17 vs `:focus-visible` 9 였다. 개수가
      # 아니라 **선택자**로 짝을 본다: 아무 데나 링을 더해 수를 맞추는 것으로는
      # 포커스가 사라진 그 요소가 고쳐지지 않는다 (FR-TOK-24·25·30).
      - name: 포커스 표시
        run: node scripts/check-focus.mjs

      # `UX-18` — 착수 시 글자 크기가 12종이었고 `11px`/`11.5px`, `13/14/15` 가
      # 뜻 없이 함께 있었다. 종수를 세지 않고 **px 리터럴을 0 으로** 재는 이유는
      # 종수 조건이라면 `10px`→`11px` 한 줄로 통과하고 다음 사람이 다시 `13px`
      # 을 적기 때문이다 (FR-TOK-32). `--ui-font` 가 `--fs-sm` 을 가리키는지도
      # 함께 본다 — 두 이름이 각자 값을 들면 키울 때 한쪽만 커진다 (FR-TOK-20).
      - name: 글자 크기
        run: node scripts/check-font-size.mjs

      # `UX-16` — 착수 시 44선언 · 28값 · 1~9999 였다. `.ed-find` 9997 ·
      # `.tc-copy` 9999 가 요점이다: **위에 있어야 한다는 뜻을 값으로 말할 방법이
      # 없어서 큰 수를 골랐다.** 리터럴을 0 으로 재고(FR-TOK-31), 층에 대한
      # 산술도 잡는다 — `calc(var(--z-modal) + 1)` 은 이름을 붙인 ±1 이고
      # 같은 층 안의 순서는 DOM 이 정한다 (FR-TOK-22 / D-TOK-8).
      - name: z-index 층
        run: node scripts/check-z-index.mjs

      # `UX-14`·`UX-15` — 착수 시 `:root` 밖 색 리터럴 116곳이었고 Tokyo Night
      # 값이 박힌 자리는 **기본 테마에서만 맞고 나머지 53종에서 어긋났다.**
      # `:root` 안은 통과시킨다: 규칙은 "리터럴을 쓰지 마라" 가 아니라 "리터럴은
      # 이름을 얻고 한자리에 모여라" 다 (FR-TOK-29). `mask-image` 는 알파만
      # 읽으므로 범위 밖이고, 건너뛴 수를 출력에 찍는다 — 조용한 예외는 구멍이다.
      - name: 하드코딩 색
        run: node scripts/check-hardcoded-color.mjs

      # M8_UNIFIED_SRS FR-B-3 — 문구가 카탈로그 밖에 남으면 외부화는 그 커밋에서 되돌아간다.
      # JS 리터럴·HTML 텍스트/속성·CSS `content` 의 한글 0, ko·en 키 집합 일치, `t`/`tn` 의
      # 가려짐. 예외 등록부는 스크립트 상단 — 줄마다 사유가 있다.
      - name: 문구 카탈로그
        run: node scripts/check-i18n.mjs

      # 서식은 취향이 아니라 diff 의 크기다 (TEST-10). 착수 시 1건 위반이 있었다.
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "::error::gofmt 위반 — 아래 파일에 gofmt -w 를 돌리세요"
            echo "$out"
            exit 1
          fi

      # go vet 만으로는 부족하다 (TEST-9 · DOC-7). 규칙은 `.golangci.yml` 에 있고
      # **결함 탐지만** 켠다 — 스타일 규칙을 켜면 한꺼번에 빨개지고 그러면 아무도
      # 보지 않는 게이트가 된다.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8
        with:
          version: v2.13.2

      # 알려진 취약점 (SEC-28). 직접 의존이 2개뿐이라 값이 없어 보이지만, 값이
      # 없다는 것은 **확인해야 아는 사실**이고 그 확인이 없었다.
      #
      # **판을 고정한다.** `@latest` 는 이 저장소에서 실제로 CI 를 멈춰 세웠다
      # (2026-09-10): 러너의 툴체인은 `go.mod` 이 정하는데(`go 1.24.0`,
      # `GOTOOLCHAIN=local`) 도구만 떠 있으면 언젠가 반드시 어긋난다 — 그날
      # `v1.8.0` 이 `go >= 1.26.0` 을 요구하며 설치 단계에서 죽었다.
      #
      # `v1.1.4` 가 `go 1.22` 를 요구하는 마지막 판이다 (v1.2.0 부터 1.25 를
      # 요구한다). 취약점 **데이터베이스는 원격**이므로 판을 고정해도 탐지는
      # 최신이다 — 고정되는 것은 분석기뿐이다.
      #
      # 이웃 도구들은 이미 고정돼 있다(`golangci-lint v2.13.2`, action 은 SHA).
      # 이 자리만 예외였다.
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          "$(go env GOPATH)/bin/govulncheck" ./...

      # 커버리지는 **실패시키지 않는다** (TEST-12 · CI_GATES_SRS §3).
      # 지금 문턱을 걸면 그 숫자가 근거 없는 값이 된다 — `internal/ctl/cli` 31.5%·
      # `cmd/dongminal` 0% 처럼 낮은 자리가 실재하고 그것을 올리는 것은 M8 의 일이다.
      # 여기서는 기준선을 쌓기 시작한다.
      - name: 커버리지 (기준선 아티팩트)
        run: |
          # 위 주석대로 **커버리지는 실패시키지 않는다.** 그런데 `bash -e` 아래에서
          # `go test` 의 비영 종료가 이 job 을 넘어뜨리고 있었고, 게다가 출력을
          # `/dev/null` 로 버려 **무엇이 졌는지 볼 수도 없었다** — 게이트가 빨간데
          # 사유를 말하지 않는 상태가 그렇게 생긴다 (2026-09-16 실측).
          #
          # 판정은 위의 `test` 잡이 한다 (`-race -shuffle=on`). 여기서는 말을
          # 남기고 넘어간다.
          go test -coverprofile=coverage.out -covermode=atomic ./... \
            || echo "::warning::커버리지 회차에서 테스트가 졌다 — 판정은 test 잡이 한다"
          # 프로파일이 없으면 요약도 없다. 그 사실만 말하고 넘어간다.
          test -s coverage.out && go tool cover -func=coverage.out | tail -1 \
            || echo "::warning::coverage.out 이 비었다"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage.out
          retention-days: 14

  # 프론트엔드 — 종전에는 **아무 검사기도 없었다** (02-fe-arch 의 P1).
  #
  # 35,120 LOC 에 린터·타입 검사·단위 테스트가 전부 0이었고, 유일한 안전망이
  # 사람이 손으로 돌리는 e2e 135 스펙이었다. 오타가 런타임까지 갔다는 뜻이다.
  #
  # 세 층을 세운다. 셋 다 표준 도구이고 번들러를 들이지 않는다.
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: 의존
        run: npm ci

      # e2e 는 Playwright 가 **트랜스파일만** 한다 — 타입 오류는 러너가 브라우저를
      # 띄운 뒤에야 나온다 (TEST-11). 프론트 본체는 `// @ts-check` 를 단 파일만
      # 본다 (CI_GATES_SRS B2 의 예외).
      - name: 타입 검사
        run: npm run typecheck

      # `no-undef`·`no-unused-vars`·`no-empty` 셋뿐이다. 전역 스크립트 구조에서
      # 없는 이름을 잡는 것이 이 층의 값이다 — 실제로 죽은 선언 넷을 찾았다.
      - name: eslint
        run: npm run lint

      # 순수 로직 모듈의 단위 테스트 (TEST-27). 종전에는 이것을 **e2e 로 돌렸다** —
      # `git-hunk.spec.ts` 가 브라우저를 띄워 좌표 계산 함수를 검사했다.
      - name: 프론트 단위 테스트
        run: npm run unit

  windows-runtime:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod

      - name: 바이너리 빌드
        run: go build -o dongminal.exe ./cmd/dongminal

      # doctor 는 플랫폼 계층을 계층별로 실제 실행한다. 실패하면 어느 계층에서
      # 무슨 오류였는지 그대로 나온다.
      - name: doctor
        run: |
          $env:DONGMINAL_HOME = "$env:RUNNER_TEMP\dm-doctor"
          .\dongminal.exe doctor
        shell: pwsh

      # 종단간. doctor 가 덮지 못하는 **데몬 모드**를 여기서 확인한다 —
      # 서버가 데몬을 끊어 띄우고, 그 데몬 안의 ConPTY 에 붙은 셸이 실제로
      # 입출력을 왕복해야 한다.
      - name: 종단간 (서버 → 데몬 → ConPTY)
        run: .\dongminal.exe verify
        shell: pwsh

  linux-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod

      - name: 바이너리 빌드
        run: go build -o dongminal ./cmd/dongminal

      - name: doctor
        run: DONGMINAL_HOME="$RUNNER_TEMP/dm-doctor" ./dongminal doctor

      - name: 종단간 (서버 → 데몬 → PTY)
        run: ./dongminal verify

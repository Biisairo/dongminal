# 의존 갱신 (04-secops SEC-28·SEC-29 · CI_GATES_SRS C3).
#
# 셋을 본다. 그중 **github-actions 가 이 파일의 주된 이유**다 — 액션을 커밋 SHA
# 로 고정했으므로(SEC-29) 사람이 손으로는 갱신하지 않는다. 고정만 하고 갱신을
# 세우지 않으면 영원히 옛 판을 쓰게 되고, 그것은 태그 참조보다 나쁘다.
#
# 주 단위인 것은 이 저장소의 의존이 적기 때문이다 — 직접 2개(`go.mod`)와
# devDependency 4개(`package.json`). 매일 보면 알림만 늘고 볼 것이 없다.

version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    commit-message:
      # 이 저장소의 규약은 `type(scope): …` 이다.
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(ci)"

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"

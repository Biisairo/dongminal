<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- interactive-widget=resizes-visual (FR-MTI-27): resizes-content 는 소프트
     키보드가 layout viewport 를 줄여 window resize 를 연발하고, 그 fit 이
     rows 를 왕복시킨다(실측 17회, 33↔13). rows 가 늘어날 때 xterm 은
     스크롤백을 화면으로 흡수하므로 스크롤할 내용 자체가 사라졌다. -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-visual">
  <title>Dongminal</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="assets/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="icon" href="assets/favicon-16.png" sizes="16x16" type="image/png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="stylesheet" href="vendor/xterm.css">
  <link rel="stylesheet" href="style.css?v=156">
  <script>try{var w=parseInt(localStorage.getItem('sidebarWidth'));if(w>=100&&w<=400)document.documentElement.style.setProperty('--sb-w',w+'px')}catch(e){}</script>
</head>
<body>
<div id="app">
  <div id="drawer-backdrop"></div>
  <div id="sidebar">
    <div class="sb-title">Windows</div>
    <button id="add-window">+ New</button>
    <button id="add-preset" title="기본 프리셋으로 새 창">★ Preset</button>
    <div id="windows"></div>

    <div class="sb-title git-sec-title">Git</div>
    <div id="git-repos"></div>
    <button id="git-add-repo" title="리포 추가">+ Add</button>

    <button id="settings-btn" title="Settings">⚙</button>
  </div>
  <div id="sb-handle"></div>
  <div id="content">
    <div id="topbar">
      <span id="window-name"></span>
      <span class="m-pane-nav mobile-only">
        <button class="mtbtn" id="m-pane-prev" title="이전 pane">‹</button>
        <span id="m-pane-indicator">1/1</span>
        <button class="mtbtn" id="m-pane-next" title="다음 pane">›</button>
      </span>
      <span class="spacer"></span>
      <button class="tbtn" id="attn-badge" title="주의 알림" style="display:none">🔔<span class="attn-count">0</span></button>
      <button class="tbtn desktop-only" id="split-h" title="Split Horizontal (Ctrl+Shift+H)">Split H</button>
      <button class="tbtn desktop-only" id="split-v" title="Split Vertical (Ctrl+Shift+V)">Split V</button>
      <!-- FR-GIT-183: Git 창은 WINDOWS 목록에 없으므로 닫는 길을 여기 둔다. -->
      <button class="tbtn" id="git-close" title="Git 창 닫기" style="display:none">Close Git</button>
      <button class="tbtn desktop-only" id="agents-toggle" title="에이전트 모아보기">Agents</button>
      <button class="mtbtn mobile-only" id="m-search-btn" title="검색">🔍</button>
      <button class="mtbtn mobile-only" id="m-add-tab" title="새 탭">+</button>
      <button class="mtbtn mobile-only" id="m-drawer-toggle" title="메뉴">☰</button>
    </div>
    <div id="area"></div>
    <div id="search-bar" class="search-bar hidden">
      <span class="search-icon">⌕</span>
      <input id="search-input" type="text" placeholder="검색...">
      <button id="search-prev" title="이전 (Shift+Enter)">↑</button>
      <button id="search-next" title="다음 (Enter)">↓</button>
      <button id="search-case" title="대소문자 구분">Aa</button>
      <span id="search-count"></span>
      <button id="search-close" title="닫기 (Esc)">✕</button>
    </div>
    <div id="status-bar" class="status-bar">
      <span id="sb-items"></span>
      <button class="tbtn" id="sb-bg-btn" title="백그라운드 도구" style="display:none"></button>
    </div>
  </div>
  <div id="agents-handle"></div>
  <div id="agents-panel"></div>
  <div id="mobile-keybar" class="mobile-only"></div>
</div>

<!-- 주의 알림 센터 (FR-PAN-16) -->
<div id="attn-center"></div>

<!-- Settings Modal -->
<div id="modal-overlay">
  <div id="modal">
    <div class="modal-header">
      <span class="modal-title">Settings</span>
      <button class="modal-close" id="modal-close">×</button>
    </div>
    <div class="modal-tabs">
      <button class="mtab active" data-tab="theme">Theme</button>
      <button class="mtab" data-tab="shortcuts">Shortcuts</button>
      <button class="mtab" data-tab="statusbar">Status Bar</button>
      <button class="mtab" data-tab="presets">Presets</button>
      <button class="mtab" data-tab="display">Display</button>
      <button class="mtab" data-tab="notify">Notifications</button>
    </div>
    <div class="modal-body">
      <div class="mpanel" id="panel-theme">
        <div class="theme-layout">
          <div class="theme-list" id="theme-list"></div>
          <div class="theme-preview-panel" id="theme-preview"></div>
        </div>
        <button id="custom-toggle">✏ Customize Current Theme</button>
        <div id="custom-editor" style="display:none">
          <div class="ce-section"><div class="ce-title">UI Colors</div><div class="ce-colors" id="ce-ui"></div></div>
          <div class="ce-section"><div class="ce-title">Terminal Colors</div><div class="ce-colors" id="ce-terminal"></div></div>
        </div>
      </div>
      <div class="mpanel" id="panel-shortcuts" style="display:none">
        <div class="sc-list" id="sc-list"></div>
      </div>
      <div class="mpanel" id="panel-statusbar" style="display:none">
        <div class="sb-settings" id="sb-settings"></div>
      </div>
      <div class="mpanel" id="panel-presets" style="display:none">
        <div class="preset-list" id="preset-list"></div>
        <button id="preset-save" class="preset-save">현재 레이아웃 저장</button>
      </div>
      <div class="mpanel" id="panel-display" style="display:none">
        <div class="display-settings">
          <div class="ds-row">
            <span>Display Mode</span>
            <select class="sbs-select" id="ds-mode">
              <option value="auto">Auto (뷰포트 기준)</option>
              <option value="desktop">Desktop (강제)</option>
              <option value="mobile">Mobile (강제)</option>
            </select>
          </div>
          <div class="ds-row">
            <span>Mobile Breakpoint (px)</span>
            <input type="number" class="ds-num" id="ds-bp" min="320" max="2000" step="10">
          </div>
          <div class="ds-hint">'Auto' 모드에서 창 너비가 Breakpoint보다 작으면 모바일 레이아웃으로 전환됩니다.</div>
        </div>
      </div>
      <div class="mpanel" id="panel-notify" style="display:none">
        <div class="display-settings">
          <div class="ds-row">
            <span>데스크톱 알림</span>
            <input type="checkbox" id="attn-desktop">
          </div>
          <div class="ds-row">
            <span>사운드</span>
            <input type="checkbox" id="attn-sound">
          </div>
          <div class="ds-row">
            <span>에이전트 패널 새로고침 주기</span>
            <select id="agents-poll" class="sbs-select">
              <option value="2000">2초</option>
              <option value="3000">3초</option>
              <option value="5000">5초</option>
              <option value="10000">10초</option>
              <option value="30000">30초</option>
            </select>
          </div>
          <div class="ds-hint">데스크톱 알림은 브라우저 권한 허용이 필요합니다. 시각 강조와 탭 제목 배지는 항상 동작합니다.</div>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="vendor/xterm.js"></script>
<script src="vendor/addon-fit.js"></script>
<script src="vendor/addon-web-links.js"></script>
<script src="vendor/addon-unicode11.js"></script>
<script src="vendor/addon-search.js"></script>
<script src="js/core/constants.js?v=156"></script>
<script src="js/core/helpers.js?v=156"></script>
<script src="js/ui/repaint.js?v=156"></script>
<script src="js/ui/themes.js?v=156"></script>
<script src="js/ui/term-pane.js?v=156"></script>
<script src="js/ui/file-editor.js?v=156"></script>
<script src="js/ui/input-binding.js?v=156"></script>
<script src="js/git/panel.js?v=156"></script>
<script src="js/git/confirm.js?v=156"></script>
<script src="js/git/dialog.js?v=156"></script>
<script src="js/git/commit.js?v=156"></script>
<script src="js/git/lanes.js?v=156"></script>
<script src="js/git/menu.js?v=156"></script>
<script src="js/git/history.js?v=156"></script>
<script src="js/git/branches.js?v=156"></script>
<script src="js/git/stash.js?v=156"></script>
<script src="js/git/tag.js?v=156"></script>
<script src="js/git/console.js?v=156"></script>
<script src="js/git/worktrees.js?v=156"></script>
<script src="js/git/remote.js?v=156"></script>
<script src="js/git/commit-ops.js?v=156"></script>
<script src="js/ui/renderer.js?v=156"></script>
<script src="js/core/app.js?v=156"></script>
<script src="js/core/app-cmd.js?v=156"></script>
<script src="js/core/app-tool.js?v=156"></script>
<script src="js/core/app-layout.js?v=156"></script>
<script src="js/core/app-focus.js?v=156"></script>
<script src="js/core/app-attn.js?v=156"></script>
<script src="js/core/app-agents.js?v=156"></script>
<script src="js/core/app-git.js?v=156"></script>
<script src="js/core/app-search.js?v=156"></script>
<script src="js/core/app-mobile.js?v=156"></script>
<script src="js/core/app-settings.js?v=156"></script>
<script src="js/core/app-statusbar.js?v=156"></script>
<script src="js/core/app-presets.js?v=156"></script>
<script src="js/core/app-dnd.js?v=156"></script>
<script src="js/core/main.js?v=156"></script>
<script src="js/ui/version-watch.js?v=156"></script>
<!-- 실기기 진단. ?diag=1 로 접속할 때만 동작한다 -->
<script src="js/ui/diag.js?v=156"></script>
</body>
</html>

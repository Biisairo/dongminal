<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <!-- interactive-widget=resizes-visual (FR-MTI-27): resizes-content 는 소프트
     키보드가 layout viewport 를 줄여 window resize 를 연발하고, 그 fit 이
     rows 를 왕복시킨다(실측 17회, 33↔13). rows 가 늘어날 때 xterm 은
     스크롤백을 화면으로 흡수하므로 스크롤할 내용 자체가 사라졌다. -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-visual">
  <title>Dongminal</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="assets/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="icon" href="assets/favicon-16.png" sizes="16x16" type="image/png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <!-- `09` FR-ICON-4 (M5): `icon-192/512` 는 자산만 있고 **참조가 0건**이었다.
       자산과 선언이 어긋난 상태를 남기지 않는다 — 지우는 대신 참조하는 쪽으로
       닫았다. `ICON_ASSETS_SRS` FR-ICON-4 가 그 둘의 제공을 필수로 적고 있으므로
       지우는 것은 그 요구를 철회하는 일이 된다.
       판 질의문자열을 달지 않는 것은 매니페스트가 HTML 과 같은 no-cache 규약을
       따르기 때문이다 (static.go). -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="vendor/xterm.css">
  <!-- UI_KIT_SRS FR-UIK-1 / D-6: 공통 키트는 **넷보다 먼저** 온다. 캐스케이드가
       곧 의미이므로 키트가 먼저 서고 기존 파일이 그것을 덮을 수 있어야 한다. -->
  <link rel="stylesheet" href="style-kit.css?v=__ASSETV__">
  <link rel="stylesheet" href="style.css?v=__ASSETV__">
  <link rel="stylesheet" href="style-git.css?v=__ASSETV__">
  <link rel="stylesheet" href="style-git-views.css?v=__ASSETV__">
  <link rel="stylesheet" href="style-editor.css?v=__ASSETV__">
  <link rel="stylesheet" href="style-docrender.css?v=__ASSETV__">
  <!-- SIDEBAR_COLLAPSE_SRS FR-SBC-5 / D-2: 폭과 접힘을 **같은 걸음**에서 읽는다.
       자리를 나누면 폭은 첫 프레임에, 접힘은 스크립트 로드 뒤에 걸려 사이드바가
       한 번 펄럭인다. body 가 아직 없으므로 클래스는 documentElement 에 붙는다.

       **100·400 은 여기서만 숫자로 남는다** (M6 `FE-18`). 이 줄은 어떤 스크립트
       보다 먼저 돌아야 하므로 `SIDEBAR_W_MIN_PX`·`SIDEBAR_W_MAX_PX` 를 볼 수
       없다 — 고칠 때 `web/js/core/constants.js` 의 그 둘을 함께 고친다. -->
  <script>try{var w=parseInt(localStorage.getItem('sidebarWidth'));if(w>=100&&w<=400)document.documentElement.style.setProperty('--sb-w',w+'px');if(localStorage.getItem('sidebarCollapsed')==='1')document.documentElement.classList.add('sb-collapsed')}catch(e){}</script>
  <!-- BOOT_SCREEN_SRS FR-BTS-3~5 / D-4·D-6: 마지막에 쓴 테마를 **첫 페인트 전에**
       세운다. 담긴 것은 팔레트가 아니라 `applyThemeObj` 가 만든 최종 CSS 변수
       맵이므로 파생값을 여기서 다시 계산하지 않는다. 키 문자열은 constants.js 의
       `THEME_VARS_KEY` 와 같아야 한다 — 이 스크립트가 그것보다 먼저 돈다.
       캐시가 없거나 깨졌으면 아무것도 세우지 않는다: 그때의 첫 페인트는
       style.css 의 `:root` 기본값이다 (D-2).

       SYSTEM_THEME_FOLLOW_SRS FR-STF-5 / D-STF-2: 추종(`dm.themeFollow`)이 켜져
       있으면 맵이 둘(`.dark`·`.light`)이고 시스템 모드가 하나를 고른다 — 고르기만
       하고 계산하지 않는다. 키 문자열은 `THEME_FOLLOW_KEY` 와 같다. -->
  <script>try{var tk='dm.themeVars';if(localStorage.getItem('dm.themeFollow')==='1'){tk+=(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)?'.dark':'.light'}var tv=JSON.parse(localStorage.getItem(tk)||'null');if(tv&&typeof tv==='object'){var ds=document.documentElement.style;for(var k in tv)if(k.slice(0,2)==='--')ds.setProperty(k,tv[k])}}catch(e){}</script>
  <!-- M8_UNIFIED_SRS FR-B-5 / D-B-1: `<html lang>` 을 첫 페인트 전에 활성 로케일로 세운다.
       키 문자열과 지원 로케일은 `i18n.js` 의 `I18N_STORAGE_KEY`·`I18N_LOCALES` 와 같아야
       한다 — 이 스크립트가 그것보다 먼저 돈다 (테마 캐시와 같은 모양). -->
  <script>try{var lc=localStorage.getItem('dm.locale');document.documentElement.lang=lc==='en'?'en':'ko'}catch(e){}</script>
</head>

<!-- BOOT_SCREEN_SRS FR-BTS-6·9 / D-7: **정적 마크업**이다. JS 로 만들면 그 스크립트가
     실행될 때까지 아래 골격이 그대로 노출되고, 그것이 이 스펙이 없애려는 장면이다.
     단계 문구의 초기값도 여기 있다 — 스크립트가 한 줄도 돌지 않은 시점에 사용자가
     보는 것이 이 문장이다. -->
<div id="boot">
  <div class="boot-inner">
    <svg class="boot-logo" viewBox="0 0 64 64" width="64" height="64" aria-hidden="true">
      <defs>
        <linearGradient id="boot-tile" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="64" y2="64">
          <stop offset="0" stop-color="#4F8461"/>
          <stop offset="1" stop-color="#356146"/>
        </linearGradient>
      </defs>
      <rect width="64" height="64" rx="15" fill="url(#boot-tile)"/>
      <path d="M16.5 13 H34 A17 17 0 0 1 51 32 A17 17 0 0 1 34 51 H16.5 A3.5 3.5 0 0 1 13 47.5 V16.5 A3.5 3.5 0 0 1 16.5 13 Z" fill="none" stroke="#08110D" stroke-width="7.5"/>
      <path d="M24 26.5 L29.5 32 L24 37.5" fill="none" stroke="#08110D" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <div class="boot-name" lang="en">Dongminal</div>
    <!-- 진행 바는 **얼마나 남았는지 모른다**. 부팅의 두 걸음(설정·워크스페이스)은
         각자 네트워크에 달려 있어 비율로 말할 수 없다 — 그래서 채우는 대신 흐른다. -->
    <div class="boot-bar"><i></i></div>
    <div id="boot-step" data-i18n="boot.step_settings"></div>
  </div>
</div>
<div id="app">
  <div id="drawer-backdrop"></div>
  <div id="sidebar">
    <!-- GIT_SIDEBAR_TABS_SRS FR-SBT-1·18·21: 탭 버튼은 서술자 배열에서 그린다
         (sidebar-tabs.js). 여기 비워 두는 것이 "새 탭 = 서술자 1개" 를 지키는
         자리다 — 탭이 늘어도 이 파일을 다시 열지 않는다. -->
    <div id="sb-tabs"></div>
    <!-- UX_REVISION_SRS FR-BLP-5: 두 패널의 골격은 같다 — 액션 버튼 행이 먼저,
         그 다음이 목록이다. 자리 보정은 SidebarList.layoutActions 가 한 번 더
         한다 (옛 워크스페이스의 DOM 이 아니라 **이 문서**가 진실이지만, 배선을
         한 자리에 두기 위해서다). -->
    <div class="sb-panel" id="sb-panel-windows">
      <div class="sb-actions">
        <!-- SANDBOX_WINDOW_SRS: 샌드박스 창은 `+ New` 의 변종이므로 버튼을
             따로 세우지 않고 그 안에 둔다. span 인 것은 button 안에 button 을
             넣을 수 없기 때문이며, 분기는 클릭 대상으로 한다. -->
        <button id="add-window" class="ui-btn" title="New window"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-plus"/></svg>New<span id="add-sandbox-window" data-i18n-title="html.sandbox_window_title"><svg class="ui-icon ui-icon-sm" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-box"/></svg>Box</span></button>
        <button id="add-preset" class="ui-btn" title="New window from default preset"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-star"/></svg>Preset</button>
      </div>
      <div id="windows"></div>
    </div>
    <!-- REPO_TAB_UNIFY_SRS FR-RTU-1: `Git` 과 `Editor` 두 패널이 **하나**가 됐다.
         목록이 이미 같은 집합이었기 때문이다 (§2.1) — `git.pinned` 와
         `editors.list` 는 서버 연동이 한 번의 저장 안에서 함께 바꾼다.
         FR-EDT-3: 패널 래퍼는 손으로 둔다 (§2.1, D-12).
         FR-EDT-14: 고정 행(`~`·메모장)은 **패널의 최하단**이며 목록이 길어
         스크롤이 생겨도 설정 버튼 바로 위에 남는다. -->
    <div class="sb-panel" id="sb-panel-repo" hidden>
      <!-- FR-BLP-8: `+ Add` 는 목록 **위**다 — `+ New` 와 같은 자리. -->
      <div class="sb-actions">
        <button id="repo-add" class="ui-btn" title="Add a repository or folder"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-plus"/></svg>Add</button>
      </div>
      <div id="repo-entries"></div>
      <div id="repo-root"></div>
    </div>
    <!-- FR-SBT-4: 탭 밖 최하단. 어느 탭에서나 보인다.
         FR-SRL-8: 내부 새로고침도 같은 자리다 — 어느 탭에서 어긋남을 느끼든
         손이 닿아야 한다. -->
    <div id="sb-bottom">
      <button id="soft-reload-btn" class="ui-btn ui-btn-icon ui-btn-lg ui-btn-ghost" title="Reload the app without a full page refresh" aria-label="Reload the app"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-refresh-cw"/></svg></button>
      <button id="settings-btn" class="ui-btn ui-btn-icon ui-btn-lg ui-btn-ghost" title="Settings" aria-label="Settings"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-settings"/></svg></button>
    </div>
  </div>
  <!-- SIDEBAR_COLLAPSE_SRS FR-SBC-7 (2026-09-06 개정): **접기 버튼이 없다.**
       이 손잡이가 폭도 바꾸고 접기도 한다 — 끝까지 끌면 접히고, 접힌 경계를
       오른쪽으로 끌면 펼쳐진다. 접는 것과 좁히는 것은 같은 손짓의 끝과 끝이므로
       손이 이미 여기 있고, 화면에 버튼을 따로 세울 이유가 없다.
       키로도 같은 일을 한다 (`sidebarToggle`, 기본 Ctrl+Shift+E). -->
  <div id="sb-handle" title="Drag to resize — drag all the way in to collapse"></div>
  <div id="content">
    <div id="topbar">

      <button class="tbtn ui-btn desktop-only" id="runs-btn" title="Run orchestration">Runs</button>

           desktop-only 가 아니다 — 모바일에서 백그라운드 도구에 닿는 유일한
           통로다 (§2.5). 리스너는 app-statusbar.js 가 붙인다. -->
      <button class="tbtn ui-btn" id="bg-btn" title="Tools running in the background">Background</button>
      <!-- WINDOW_SLOTS_SRS FR-WSL-50: 창 **밖**을 쪼갠다 — 창 **안**을 쪼개는
           Split H·V 와 떨어진 자리다 (§7 R-3). 한계에 닿으면 비활성이 된다.

      <span class="slot-ctl desktop-only">

           스크린리더가 이름으로 읽는다는 보장도 없다. 같은 일을 하는
           `#m-search-btn` 과 **같은 이름**을 준다. -->
      <input id="search-input" type="text" data-i18n-placeholder="html.search_placeholder" aria-label="Search in this terminal">
      <button id="search-prev" class="ui-btn ui-btn-icon ui-btn-sm" title="Previous match (Shift+Enter)" aria-label="Previous match"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-arrow-up"/></svg></button>
      <button id="search-next" class="ui-btn ui-btn-icon ui-btn-sm" title="Next match (Enter)" aria-label="Next match"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-arrow-down"/></svg></button>
      <button id="search-case" class="ui-btn ui-btn-sm" title="Match case">Aa</button>
      <!-- `12-func-ui.md FUI-15`: 편집기 찾기 줄은 셋을 다 갖고 n/N 도 보인다
           (`file-editor-find.js`). 터미널만 `Aa` 하나였고 일치 수도 없었다 —
           같은 앱의 두 검색이 비대칭이었다. 벤더 addon 은 세 옵션과
           `onDidChangeResults` 를 이미 낸다. -->
      <button id="search-word" class="ui-btn ui-btn-sm" title="Match whole word">ab</button>
      <button id="search-regex" class="ui-btn ui-btn-sm" title="Use regular expression">.*</button>
      <span id="search-count"></span>
      <button id="search-close" class="ui-btn ui-btn-icon ui-btn-sm ui-btn-ghost" title="Close (Esc)" aria-label="Close"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-x"/></svg></button>

<!-- Settings Modal -->
<div id="modal-overlay" class="ui-modal">
  <div id="modal" class="ui-modal-box">
    <div class="modal-header">
      <span class="modal-title" lang="en">Settings</span>

    </div>
    <!-- FR-B-5: 탭 이름은 ko 카탈로그에서도 영어다 (FR-B-9 의 데이터) — 요소가 그 언어를 말한다. -->
    <div class="modal-tabs" lang="en">
      <button class="mtab active" data-tab="theme" title="Theme settings">Theme</button>
      <button class="mtab" data-tab="shortcuts" title="Keyboard shortcut settings">Shortcuts</button>
      <button class="mtab" data-tab="statusbar" title="Status bar settings">Status Bar</button>
      <!-- FR-PIS-20 / D-2: 흩어져 있던 주기 손잡이가 한 자리로 모인다. 자리가
           Status Bar 옆인 것은 옮겨 온 둘 중 하나가 거기 있었기 때문이다. -->
      <button class="mtab" data-tab="polling" title="Polling interval settings">Polling</button>
      <button class="mtab" data-tab="presets" title="Layout preset settings">Presets</button>
      <button class="mtab" data-tab="display" title="Display settings">Display</button>
      <!-- EDITOR_LSP_SRS FR-LSP-46 -->
      <button class="mtab" data-tab="code" title="Editor and code settings">Code</button>
      <button class="mtab" data-tab="notify" title="Notification settings">Notifications</button>
      <!-- ACCESS_ALLOWLIST_SRS FR-ACL-22: --expose 뒤의 유일한 문. -->
      <button class="mtab" data-tab="access" title="Network access allowlist">Access</button>
      <!-- SETTINGS_PORTABILITY_SRS FR-SPT-14: 설정을 파일로 옮기는 자리. -->
      <button class="mtab" data-tab="sandbox" title="Sandbox profile settings">Sandbox</button>
      <button class="mtab" data-tab="backup" title="Backup and restore settings">Backup</button>
    </div>
    <div class="modal-body">
      <div class="mpanel" id="panel-theme">
        <!-- SYSTEM_THEME_FOLLOW_SRS FR-STF-8: 추종 스위치. 이름은 `.ds-row` 구조에서 파생한다. -->
        <div class="display-settings">
          <div class="ds-row" id="theme-follow-row">
            <span data-i18n="html.theme_follow"></span>
            <input type="checkbox" id="ds-theme-follow">
          </div>
          <div class="ds-hint" hidden data-i18n="html.theme_follow_hint"></div>
        </div>
        <div class="theme-layout">
          <div class="theme-list" id="theme-list"></div>
          <div class="theme-preview-panel" id="theme-preview"></div>
        </div>
        <button id="custom-toggle" class="ui-btn" title="Toggle the custom theme editor"><svg class="ui-icon ui-icon-sm" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-pencil"/></svg>Customize Current Theme</button>
        <div id="custom-editor" style="display:none">
          <div class="ce-section"><div class="ce-title">UI Colors</div><div class="ce-colors" id="ce-ui"></div></div>
          <div class="ce-section"><div class="ce-title">Terminal Colors</div><div class="ce-colors" id="ce-terminal"></div></div>
        </div>
      </div>
      <div class="mpanel" id="panel-shortcuts" style="display:none">
        <div class="display-settings">
          <div class="ds-row">
            <span data-i18n="html.block_keys"></span>
            <input type="checkbox" id="sc-blockbrowser">
          </div>
          <div class="ds-hint" data-i18n="html.block_keys_hint"></div>
        </div>
        <div class="sc-list" id="sc-list"></div>
      </div>
      <div class="mpanel" id="panel-statusbar" style="display:none">
        <div class="sb-settings" id="sb-settings"></div>
      </div>
      <div class="mpanel" id="panel-presets" style="display:none">
        <div class="preset-list" id="preset-list"></div>
        <button id="preset-save" class="ui-btn ui-btn-lg" title="Save the current layout as a preset" data-i18n="html.preset_save"></button>
      </div>
      <div class="mpanel" id="panel-display" style="display:none">
        <div class="display-settings">
          <!-- M8_UNIFIED_SRS FR-B-4: UI 언어. 값은 서버 설정 `locale` 이고 바꾸면 다시 연다 (D-B-1). -->
          <div class="ds-row">
            <span data-i18n="html.locale"></span>
            <select class="sbs-select" id="ds-locale">
              <option value="ko" lang="ko">한국어</option>
              <option value="en" lang="en">English</option>
            </select>
          </div>
          <div class="ds-hint" data-i18n="html.locale_hint"></div>
          <div class="ds-row">
            <span data-i18n="html.page_title"></span>
            <input type="text" class="ds-text" id="ds-title" maxlength="60" placeholder="Dongminal">
          </div>
          <div class="ds-hint" data-i18n="html.page_title_hint"></div>
          <!-- FR-WSL-81: 슬롯 방향. 값은 창 안 분할과 같은 용어다. -->
          <div class="ds-row">
            <span data-i18n="html.slot_dir"></span>
            <!-- SETTINGS_CONTROLS_SRS FR-SCT-4 / D-3a·D-4a: 흔히 보는 토글 스위치다.
                 두 값의 이름은 트랙 **바깥 양쪽**에 마크업으로 그대로 적는다 — 바뀌지
                 않는 이름이고 자리도 고정이라 JS 가 채울 것이 없다. -->
            <span class="ds-switch" id="ds-slotdir">
              <span class="ds-sw-lbl l">Horizontal</span>
              <button type="button" role="switch" aria-checked="false"><i></i></button>
              <span class="ds-sw-lbl r">Vertical</span>
            </span>
          </div>
          <div class="ds-hint" data-i18n="html.slot_dir_hint"></div>
          <div class="ds-row">
            <span data-i18n="html.display_mode"></span>
            <select class="sbs-select" id="ds-mode">
              <option value="auto" data-i18n="html.mode_auto"></option>
              <option value="desktop" data-i18n="html.mode_desktop"></option>
              <option value="mobile" data-i18n="html.mode_mobile"></option>
            </select>
          </div>
          <div class="ds-row">
            <span data-i18n="html.breakpoint"></span>
            <input type="number" class="ds-num" id="ds-bp" min="320" max="2000" step="10">
          </div>
          <div class="ds-hint" data-i18n="html.mode_hint"></div>
          <!-- TAB_WIDTH_SRS FR-TBW-1·2 -->
          <div class="ds-row">
            <span data-i18n="html.tab_fixed"></span>
            <input type="checkbox" id="ds-tabfix">
          </div>
          <div class="ds-row">
            <span data-i18n="html.tab_width"></span>
            <input type="number" class="ds-num" id="ds-tabw" min="40" max="480" step="10">
          </div>
          <div class="ds-hint" data-i18n="html.tab_width_hint"></div>
          <div class="ds-row">
            <span data-i18n="html.fg_names"></span>
            <input type="checkbox" id="ds-fgnames">
          </div>
          <div class="ds-hint" data-i18n="html.fg_names_hint"></div>
          <!-- LEAVE_CONFIRM_TOGGLE_SRS FR-LVC-1·2 -->
          <div class="ds-row">
            <span data-i18n="html.confirm_leave"></span>
            <input type="checkbox" id="ds-confirmleave">
          </div>
          <div class="ds-hint" data-i18n="html.confirm_leave_hint"></div>
          <!-- UNFOCUSED_EDGE_SRS FR-UFE-10 -->
          <!-- UNFOCUSED_EDGE_SRS FR-UFE-10 / D-4a: 스위치와 정도가 **한 손잡이**다.
               0 이 곧 끔이므로 "켜져 있는데 0" 같은 뜻 없는 상태가 없다. -->
          <div class="ds-row">
            <span data-i18n="html.focus_edge"></span>
            <span class="ds-range">
              <input type="range" id="ds-focusedge" min="0" max="10" step="1" title="How strong the edge indicator is — 0 turns it off">
              <b id="ds-focusedge-val"></b>
            </span>
          </div>
          <!-- ALERT_MOBILE_CONTEXT_SRS FR-AED-8·11: 포커스 표시와 **같은 손잡이 하나**다 —
               0 이 곧 끔이고 기본은 5 (FR-UFE-10 의 D-4a 를 그대로 잇는다). -->
          <div class="ds-row">
            <span data-i18n="html.attn_edge"></span>
            <span class="ds-range">
              <input type="range" id="ds-attnedge" min="0" max="10" step="1" title="How strong the alert edge pulse is — 0 turns it off">
              <b id="ds-attnedge-val"></b>
            </span>
          </div>
          <div class="ds-hint" data-i18n="html.attn_edge_hint"></div>
          <div class="ds-hint" data-i18n="html.focus_edge_hint"></div>
        </div>

      <div class="mpanel" id="panel-code" style="display:none">

            <input type="checkbox" id="lsp-diag">

          <div class="ds-hint" data-i18n="html.word_wrap_hint"></div>
          <!-- EDITOR_MINIMAP_TOGGLE_SRS FR-MMT-1 -->
          <div class="ds-row">

          </div>
          <div class="ds-hint" data-i18n="html.minimap_hint"></div>

            <span data-i18n="html.desktop_notify"></span>
            <input type="checkbox" id="attn-desktop">

          <div class="ds-row">
            <span data-i18n="html.sound"></span>

          </div>
          <div class="ds-hint" data-i18n="html.notify_hint"></div>

     읽힌다 — 알림이 뜰 때 리전째로 새로 붙이면 보조기술이 그 변화를 놓치는 구현이

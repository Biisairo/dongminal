     스크롤백을 화면으로 흡수하므로 스크롤할 내용 자체가 사라졌다. -->

       닫았다. `ICON_ASSETS_SRS` FR-ICON-4 가 그 둘의 제공을 필수로 적고 있으므로
       지우는 것은 그 요구를 철회하는 일이 된다.
       판 질의문자열을 달지 않는 것은 매니페스트가 HTML 과 같은 no-cache 규약을
       따르기 때문이다 (static.go). -->

  <link rel="stylesheet" href="style-panel.css?v=__ASSETV__">
  <!-- SIDEBAR_COLLAPSE_SRS FR-SBC-5 / D-2: 폭과 접힘을 **같은 걸음**에서 읽는다.
       자리를 나누면 폭은 첫 프레임에, 접힘은 스크립트 로드 뒤에 걸려 사이드바가
       한 번 펄럭인다. body 가 아직 없으므로 클래스는 documentElement 에 붙는다.

       **100·400 은 여기서만 숫자로 남는다** (M6 `FE-18`). 이 줄은 어떤 스크립트
       보다 먼저 돌아야 하므로 `SIDEBAR_W_MIN_PX`·`SIDEBAR_W_MAX_PX` 를 볼 수
       없다 — 고칠 때 `web/js/core/constants.js` 의 그 둘을 함께 고친다. -->
  <!-- HOT_REBIND_SRS FR-HRB-26: 서버가 포트를 옮긴 뒤의 첫 페이지면 맡긴 localStorage 를 되넣는다.
       localStorage 를 읽는 아래 머리 스크립트(테마·언어)보다 먼저 돌아야 한다. -->
  <script src="js/core/server-move.js?v=__ASSETV__"></script>
  <!-- PANEL_LAYOUT_SRS FR-PLY-22: 저장 레이아웃의 씨앗을 이 탭에 넣는다. 아래 줄보다 먼저
       돌아야 한다 — 아래 줄이 그 값(폭·접힘)을 읽는다. 접힘도 이 탭의 것이다 (FR-PLY-1). -->
  <script src="js/core/panel-layout.js?v=__ASSETV__"></script>
  <script>try{var w=parseInt(sessionStorage.getItem('sidebarWidth'));if(w>=100&&w<=400)document.documentElement.style.setProperty('--sb-w',w+'px');if(sessionStorage.getItem('sidebarCollapsed')==='1')document.documentElement.classList.add('sb-collapsed')}catch(e){}</script>
  <!-- BOOT_SCREEN_SRS FR-BTS-3~5 / D-4·D-6: 마지막에 쓴 테마를 **첫 페인트 전에**
       세운다. 담긴 것은 팔레트가 아니라 `applyThemeObj` 가 만든 최종 CSS 변수
       맵이므로 파생값을 여기서 다시 계산하지 않는다. 키 문자열은 constants.js 의
       `THEME_VARS_KEY` 와 같아야 한다 — 이 스크립트가 그것보다 먼저 돈다.
       캐시가 없거나 깨졌으면 아무것도 세우지 않는다: 그때의 첫 페인트는
       style.css 의 `:root` 기본값이다 (D-2).

       SYSTEM_THEME_FOLLOW_SRS FR-STF-5 / D-STF-2: 추종(`dm.themeFollow`)이 켜져
       있으면 맵이 둘(`.dark`·`.light`)이고 시스템 모드가 하나를 고른다 — 고르기만
       하고 계산하지 않는다. 키 문자열은 `THEME_FOLLOW_KEY` 와 같다. -->
  <script>try{var tk='dm.themeVars';if(localStorage.getItem('dm.themeFollow')==='1'){tk+=(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)?'.dark':'.light'}var tv=JSON.parse(localStorage.getItem(tk)||'null');if(tv&&typeof tv==='object'){var ds=document.documentElement.style;for(var k in tv)if(k.slice(0,2)==='--')ds.setProperty(k,tv[k])}}catch(e){}</script>
  <!-- M8_UNIFIED_SRS FR-B-5 / D-B-1: `<html lang>` 을 첫 페인트 전에 활성 로케일로 세운다.
       키 문자열과 지원 로케일은 `i18n.js` 의 `I18N_STORAGE_KEY`·`I18N_LOCALES` 와 같아야
       한다 — 이 스크립트가 그것보다 먼저 돈다 (테마 캐시와 같은 모양). -->
  <script>try{var lc=localStorage.getItem('dm.locale');document.documentElement.lang=lc==='en'?'en':'ko'}catch(e){}</script>

<!-- BOOT_SCREEN_SRS FR-BTS-6·9 / D-7: **정적 마크업**이다. JS 로 만들면 그 스크립트가
     실행될 때까지 아래 골격이 그대로 노출되고, 그것이 이 스펙이 없애려는 장면이다.
     단계 문구의 초기값도 여기 있다 — 스크립트가 한 줄도 돌지 않은 시점에 사용자가
     보는 것이 이 문장이다. -->
<div id="boot">
  <div class="boot-inner">
    <svg class="boot-logo" viewBox="0 0 64 64" width="64" height="64" aria-hidden="true">
      <defs>
        <linearGradient id="boot-tile" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="64" y2="64">
          <!-- FR-WRD-35: 값은 `:root` 의 브랜드 토큰이 갖는다. 인라인 SVG 는 CSS
               변수를 상속받고 이 `<svg>` 는 `<body>` 안이므로 그 토큰이 닿는다. -->
          <stop offset="0" stop-color="var(--boot-brand)"/>
          <stop offset="1" stop-color="var(--boot-brand-dk)"/>
        </linearGradient>
      </defs>
      <rect width="64" height="64" rx="15" fill="url(#boot-tile)"/>
      <path d="M16.5 13 H34 A17 17 0 0 1 51 32 A17 17 0 0 1 34 51 H16.5 A3.5 3.5 0 0 1 13 47.5 V16.5 A3.5 3.5 0 0 1 16.5 13 Z" fill="none" stroke="var(--boot-brand-ink)" stroke-width="7.5"/>
      <path d="M24 26.5 L29.5 32 L24 37.5" fill="none" stroke="var(--boot-brand-ink)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <div class="boot-name" lang="en">Dongminal</div>
    <!-- 진행 바는 **얼마나 남았는지 모른다**. 부팅의 두 걸음(설정·워크스페이스)은
         각자 네트워크에 달려 있어 비율로 말할 수 없다 — 그래서 채우는 대신 흐른다. -->
    <div class="boot-bar"><i></i></div>
    <div id="boot-step" data-i18n="boot.step_settings"></div>
  </div>
</div>
<div id="app">
  <div id="drawer-backdrop"></div>
  <!-- PANEL_TEMPLATE_SRS FR-PNT-1·2·20: 패널 템플릿 — 머리(`ui-panel-head` = 탭 줄 + 끝 단추) · 몸통 · 바닥.
       Activity(`#agents-panel`)와 같은 골격이다. 모바일 시트는 `data-sheet` 쪽에서 들어온다. -->
  <div id="sidebar" class="ui-scroll ui-panel" data-sheet="left">
    <!-- REFACTOR3_FE_REST4_SRS FR-FR4-5 (D-FR4-6): 레일 표식 `data-rail` 을 첫 페인트 전에 세운다. 머리 스크립트가
         접힘(`html.sb-collapsed`)을 붙일 때 이 요소는 아직 없다. 이 시점에 `body.mobile` 은 없으므로 접힘이 곧 레일이다.
         이후는 `Panel.railSync` 한 자리가 맡는다. -->
    <script>if(document.documentElement.classList.contains('sb-collapsed'))document.getElementById('sidebar').setAttribute('data-rail','')</script>
    <div id="sb-head" class="ui-panel-head">
      <!-- GIT_SIDEBAR_TABS_SRS FR-SBT-1·18·21: 탭 버튼은 서술자 배열에서 그린다
           (sidebar-tabs.js). 여기 비워 두는 것이 "새 탭 = 서술자 1개" 를 지키는
           자리다 — 탭이 늘어도 이 파일을 다시 열지 않는다. -->
      <div id="sb-tabs" class="ui-panel-tabs"></div>
      <!-- FR-PNT-3·12: 끝 단추. 모바일의 닫기(`#drawer-close`)를 mobile-controller.js 가 여기 넣는다. -->
      <div id="sb-acts" class="ui-panel-acts"></div>
    </div>
    <!-- UX_REVISION_SRS FR-BLP-5: 두 패널의 골격은 같다 — 액션 버튼 행이 먼저,
         그 다음이 목록이다. 자리 보정은 SidebarList.layoutActions 가 한 번 더
         한다 (옛 워크스페이스의 DOM 이 아니라 **이 문서**가 진실이지만, 배선을
         한 자리에 두기 위해서다). -->
    <div class="sb-panel" id="sb-panel-windows">
      <div class="sb-actions">
        <!-- SANDBOX_WINDOW_SRS: 샌드박스 창은 `+ New` 의 변종이므로 버튼을
             따로 세우지 않고 그 안에 둔다. span 인 것은 button 안에 button 을
             넣을 수 없기 때문이며, 분기는 클릭 대상으로 한다. -->
        <button id="add-window" class="ui-btn" title="New window"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-plus"/></svg><span class="ui-btn-label" data-i18n="html.btn_new">New</span><span id="add-sandbox-window" data-i18n-title="html.sandbox_window_title"><svg class="ui-icon ui-icon-sm" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-container"/></svg><span class="ui-btn-label" data-i18n="html.btn_new_box">Box</span></span></button>
        <button id="add-preset" class="ui-btn" title="New window from default preset"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-bookmark"/></svg><span class="ui-btn-label" data-i18n="html.btn_preset">Preset</span></button>
        <button id="add-group" class="ui-btn" title="New window group"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-window-group"/></svg><span class="ui-btn-label" data-i18n="html.btn_group">Group</span></button>
      </div>
      <div id="windows"></div>
    </div>
    <!-- REPO_TAB_UNIFY_SRS FR-RTU-1: `Git` 과 `Editor` 두 패널이 **하나**가 됐다.
         목록이 이미 같은 집합이었기 때문이다 (§2.1) — `git.pinned` 와
         `editors.list` 는 서버 연동이 한 번의 저장 안에서 함께 바꾼다.
         FR-EDT-3: 패널 래퍼는 손으로 둔다 (§2.1, D-12).
         FR-EDT-14: 고정 행(`~`·메모장)은 **패널의 최하단**이며 목록이 길어
         스크롤이 생겨도 설정 버튼 바로 위에 남는다. -->
    <div class="sb-panel" id="sb-panel-repo" hidden>
      <!-- FR-BLP-8: `+ Add` 는 목록 **위**다 — `+ New` 와 같은 자리. -->
      <div class="sb-actions">
        <button id="repo-add" class="ui-btn" title="Add a repository or folder"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-plus"/></svg><span class="ui-btn-label" data-i18n="html.btn_repo_add">Add</span></button>
      </div>
      <div id="repo-entries"></div>
      <div id="repo-root"></div>
    </div>
    <!-- CHAT_WINDOW_SRS FR-CW-21: `채팅` 탭의 본문 — 새 그룹 대화 · 방 · 온라인. 그리기는 chat-window.js 다. -->
    <div class="sb-panel" id="sb-panel-chat" hidden>
      <div id="chat-list" class="chat-list ui-scroll"></div>
    </div>
    <!-- FR-SBT-4: 탭 밖 최하단. 어느 탭에서나 보인다.
         FR-SRL-8: 내부 새로고침도 같은 자리다 — 어느 탭에서 어긋남을 느끼든
         손이 닿아야 한다. -->
    <div id="sb-bottom">
      <button id="soft-reload-btn" class="ui-btn ui-btn-icon ui-btn-lg ui-btn-ghost" title="Reload the app without a full page refresh" aria-label="Reload the app"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-refresh-cw"/></svg></button>
      <button id="settings-btn" class="ui-btn ui-btn-icon ui-btn-lg ui-btn-ghost" title="Settings" aria-label="Settings"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-settings"/></svg></button>
      <!-- UX_AUDIT_FIX_SRS FR-UXF-92 (D-30): 모바일의 새 판 링크 — 상태바 배지와 같은 글자·주소. 채우기는 update-controller.js 다. -->
      <a id="m-update-link" class="sb-update mobile-only" hidden target="_blank" rel="noopener noreferrer"></a>
    </div>
  </div>
  <!-- SIDEBAR_COLLAPSE_SRS FR-SBC-7 (2026-09-06 개정): **접기 버튼이 없다.**
       이 손잡이가 폭도 바꾸고 접기도 한다 — 끝까지 끌면 접히고, 접힌 경계를
       오른쪽으로 끌면 펼쳐진다. 접는 것과 좁히는 것은 같은 손짓의 끝과 끝이므로
       손이 이미 여기 있고, 화면에 버튼을 따로 세울 이유가 없다.
       키로도 같은 일을 한다 (`sidebarToggle`, 기본 Ctrl+Shift+E). -->
  <div id="sb-handle" class="ui-resize-handle" title="Drag to resize — drag all the way in to collapse"></div>
  <div id="content">
    <div id="topbar">
      <!-- UX_AUDIT_FIX_SRS FR-UXF-91 (D-30): 모바일 연결 점. 칠하기는 mobile-controller.js `mTopPaint` 다. -->
      <span class="m-conn-dot mobile-only" role="img" title="Disconnected" aria-label="Disconnected"></span>
      <span id="window-name"></span>
      <!-- SLOT_MARKER_SRS FR-SMK-1·2: 칸이 여럿이면 **이 자리는 빈다**
           (SLOT_TITLE_BOUNDARY_SRS FR-STB-12) — 머리글이 창 이름을 이어받기
           때문이다. 마커가 필요한 조건과 그 자리가 비는 조건이 **같은 식**이므로
           (`slotCount()>1`) 그 빈자리에 선다. 사각형은 칸 수만큼 서며

     안쪽 `<i>` 는 맥박만 진다 (세기는 바깥이 든다, D-8).

<!-- ACCESSIBILITY_BASELINE_SRS FR-A11Y-19 / D-A11Y-4 (`UX-8`): 알림의 라이브 리전.
     **여기 정적으로 서 있는 것이 요구다.** 리전은 내용이 바뀌기 전에 DOM 에 있어야
     읽힌다 — 알림이 뜰 때 리전째로 새로 붙이면 보조기술이 그 변화를 놓치는 구현이
     있다. 착수 시 `Toast` 가 정확히 그랬다(첫 `show()` 가 호스트를 만들었다).
     `role="status"` 는 공손한(polite) 리전이며 WCAG 4.1.3(상태 메시지, AA)의 정본
     대응이다. `aria-atomic="false"` 는 **더해진 것만** 읽으라는 뜻이다 — 알림이
     둘 쌓였을 때 앞의 것을 다시 읽으면 소음이 된다.
     `toast.js` 가 이것을 찾아 쓰고, 소프트 리로드가 지운 뒤에는 같은 속성으로
     다시 세운다 (`_host`). -->

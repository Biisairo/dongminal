name: e2e

# 브라우저 종단간 (Playwright). **개발 호스트가 아닌 두 OS · 매 푸시**
# (CI_E2E_MATRIX_SRS).
#
# 종전에는 ubuntu 하나에서, 그것도 사람이 부를 때와 태그를 밀 때만 돌았다. 그
# 판단은 비용에 대한 것이었고("커밋 대부분은 Go 층이거나 문서이며 그쪽은 `verify`
# 가 지킨다"), 접수한 지시는 덮개에 대한 것이다 — 확인하려면 돌아야 한다 (D-1).
#
# 한 OS 의 초록은 다른 OS 를 말하지 않는다. 이 앱의 결함이 실제로 나온 자리가
# 플랫폼 계층이고(CROSS_PLATFORM_SRS §11), 브라우저 종단간은 그 계층을 가장 많이
# 지나는 표면이다.
#
# **darwin 은 여기서 돌지 않는다** (D-7). 개발 호스트가 macOS 이고 전량을 밀기
# 전에 그 자리에서 돌린다 — 같은 것을 러너에서 한 번 더 돌리는 값이 없다. 러너가
# 덮는 것은 **사람이 손으로 볼 수 없는 두 OS** 다.

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

# 새 푸시는 같은 ref 의 이전 실행을 끊는다 (E2E_PARALLEL_SRS FR-EPL-10 / D-8).
# 고치는 동안 옛 실행이 러너를 붙들고 있으면 새 실행이 큐에서 기다린다 —
# Windows 샤드가 한 시간을 쓰던 회차에서 그것이 그대로 대기 시간이 되었다.
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    # OS × 샤드. OS 마다 job 을 따로 적으면 스텝이 두 벌이 되고, 두 벌이면 한쪽만
    # 고쳐진다 (FR-E2I-1 의 선례) — 그래서 매트릭스다 (D-2).
    #
    # 샤드로 가르는 이유는 러너를 늘리기 위해서다.
    #
    # **이 주석은 한 번 사실과 어긋났다** (05-test TEST-15). 종전에는 "`workers: 1`
    # 이고 그것은 바꿀 수 없다 — 테스트 전부가 서버 인스턴스 하나를 공유한다" 로
    # 적혀 있었는데, `E2E_PARALLEL_SRS` 가 그 전제를 없앴다: 이제 **워커마다 자기
    # 인스턴스·홈·포트**를 갖고(FR-EPL-1·7) `workerCount()` 가 2~4 를 준다
    # (`playwright.config.ts:39-44`). 남아 있는 것은 `fullyParallel: false` 뿐이며
    # 그것은 파일 **안**의 순서 의존 때문이다(같은 파일:83-94).
    #
    # `fail-fast: false` 는 규약이다 (D-3). 한 OS 의 실패로 나머지를 끊으면 고칠
    # 때마다 한 OS 씩만 보이게 된다 — 두 OS 의 실패 목록을 한 번에 받아야 한다.
    #
    # 샤드가 8인 것은 Windows 의 실측이다 (D-8). 그 OS 는 셸(pwsh) 기동이 느려
    # 항목당 시간이 macOS 의 몇 배이고, 4샤드로는 한 샤드가 상한 안에 끝나지
    # 않았다. 나누는 값은 러너 수뿐이므로 ubuntu 도 같은 수로 둔다 — OS 마다
    # 다른 수를 쓰면 `--shard=n/N` 의 N 이 두 벌이 되고, 그것이 D-2 가 막으려던
    # 바로 그 모양이다.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    runs-on: ${{ matrix.os }}
    # 로컬(macOS) 실측이 전체 25분이므로 샤드 하나는 그 1/8 이지만, 러너는 그보다
    # 느리고 `retries: 1` 이 실패 항목마다 한 번을 더 돈다
    # (`playwright.config.ts:71` — 종전 주석의 `retries: 2` 는 사실이 아니었다).
    #
    # 60분인 것은 Windows 의 실측 때문이다 — 4샤드 시절 한 샤드가 23분에 74항목만
    # 지났다. 샤드를 8로 늘려 몫을 절반으로 줄였지만, 그 OS 는 셸 기동이 느려
    # 여유가 필요하다.
    #
    # **샤드 8 을 유지한다** (CI_GATES_SRS §5 · TEST-29). 워커가 1에서 2~4 로
    # 늘었으므로 산술만 보면 4샤드로 줄여도 옛 8샤드와 비슷하고 러너 셋업을
    # 절반으로 줄인다. 그런데 8과 60분은 **러너 실측**에서 나온 값이고 줄이는
    # 근거는 산술뿐이다 — 틀리면 Windows 샤드가 상한에 걸려 CI 가 빨개진다.
    # 실측 없이 바꾸는 것은 게이트를 세우는 일이 아니라 거는 일이다.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22

      # 픽스처가 만드는 저장소의 전제다 (FR-CEM-5).
      #
      # `git_fixture.sh` 는 `reset --hard main` 을 쓴다 — 개발 호스트에는
      # `init.defaultBranch=main` 이 있어 그냥 통과하지만, 러너의 기본은 `master`
      # 라 그대로 두면 git 스펙이 통째로 무너진다.
      # 이름·메일은 스펙 대부분이 저장소마다 직접 세우지만, 세우지 않는 자리가
      # 하나라도 있으면 `commit` 이 거기서 멈춘다 — 전역에 두는 편이 싸다.
      #
      # `shell: bash` 는 windows 러너에서도 같은 한 벌을 쓰기 위한 것이다.
      - name: git 기본값
        shell: bash
        run: |
          git config --global init.defaultBranch main
          git config --global user.name  'dongminal e2e'
          git config --global user.email 'e2e@example.invalid'
          # 줄바꿈을 건드리지 않는다 (FR-CEM-24). Git for Windows 의 기본값은
          # `core.autocrlf=true` 라 체크아웃이 `\n` 을 `\r\n` 으로 바꾼다 —
          # 픽스처가 쓴 내용과 검사가 읽은 내용이 그 한 글자만큼 갈리고,
          # 실패는 "A 를 기대했는데 A 가 왔다" 처럼 읽혀 원인을 감춘다.
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: 의존
        run: npm ci

      - name: 브라우저
        run: npx playwright install --with-deps chromium

      # `globalSetup` 이 서버 바이너리를 만든다 (E2E_PARALLEL_SRS FR-EPL-8).
      # 그 컴파일을 러너의 빈 캐시로 하면 첫 워커가 그만큼 늦게 뜨므로, 여기서
      # 한 번 돌려 캐시를 데운다.
      - name: 빌드 캐시 예열
        run: go build ./cmd/dongminal

      # 리포터를 둘 세운다. `html` 은 실패 시 올리는 artifact 의 것이고, `line` 은
      # **로그에 남는 것**이다 — html 만 두면 job 로그에 서버 로그만 남아, 무엇이
      # 몇 개 실패했는지 로그만 보고는 알 수 없다 (Windows 1차 실행에서 실측).
      # 러너 **안**은 워커가 나눈다 (E2E_PARALLEL_SRS FR-EPL-7·11). 워커마다 자기
      # 서버·자기 인스턴스 홈·자기 포트를 갖는다 — 샤드를 더 늘리는 것은 러너의
      # 셋업 비용을 반복하지만 워커는 그러지 않는다.
      - name: e2e (샤드 ${{ matrix.shard }}/8)
        run: npx playwright test --shard=${{ matrix.shard }}/8 --reporter=line,html,./e2e/parity-reporter.ts

      # flaky 수를 **잡 요약에 드러낸다** (05-test 의 P1 · CI_GATES_SRS §3).
      #
      # `retries: 1` 이 한 번까지 봐주므로 흔들린 항목도 초록으로 끝난다. 그 수를
      # 아무도 세지 않던 동안 제품 결함 셋이 초록 뒤에 있었고 사용자는 그것을
      # "가끔 안 된다" 로 만나고 있었다 (`playwright.config.ts:51-70`).
      #
      # **M6 에서 실패로 승격됐다.** 판정은 위 단계의 `parity-reporter.ts` 가
      # 한다 — 그것이 검사 결과를 아는 유일한 자리이고, 판정이 두 벌이면 한쪽만
      # 고쳐진다. 여기는 **수를 요약에 적는 일만** 한다.
      #
      #   이전 동작: 세어서 요약에 적고 기준선(4)을 기록했다
      #   새  동작: `flaky > 0` 이면 e2e 단계 자체가 실패한다
      #   이유:     "올리지 않는다" 의 근거였던 계통 결함을 M6 이 닫았다
      #             (`OPTIMISTIC_LAYOUT_SRS` · `GIT_REFRESH_LIFECYCLE_SRS`)
      - name: flaky 요약
        if: always()
        shell: bash
        run: |
          n=$(cat parity-flaky.txt 2>/dev/null || echo 0)
          echo "### e2e ${{ matrix.os }} 샤드 ${{ matrix.shard }}/8" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- flaky: **$n** (0 이 아니면 이 샤드는 실패다 — CI_GATES_SRS §3)" >> "$GITHUB_STEP_SUMMARY"

      # 실패했을 때만 남긴다. 초록인 실행의 리포트는 아무도 열지 않는다.
      # 이름에 OS 가 들어가는 것은 규약이다 (D-6) — 샤드 번호만 쓰면 두 OS 가 같은
      # 이름을 올리고, `upload-artifact@v4` 는 같은 이름을 두 번 받지 않는다.
      - name: 리포트 (실패 시)
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: playwright-report-${{ matrix.os }}-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

name: e2e

# 브라우저 종단간 (Playwright). **개발 호스트가 아닌 두 OS · 매 푸시**
# (CI_E2E_MATRIX_SRS).
#
# 종전에는 ubuntu 하나에서, 그것도 사람이 부를 때와 태그를 밀 때만 돌았다. 그
# 판단은 비용에 대한 것이었고("커밋 대부분은 Go 층이거나 문서이며 그쪽은 `verify`
# 가 지킨다"), 접수한 지시는 덮개에 대한 것이다 — 확인하려면 돌아야 한다 (D-1).
#
# 한 OS 의 초록은 다른 OS 를 말하지 않는다. 이 앱의 결함이 실제로 나온 자리가
# 플랫폼 계층이고(CROSS_PLATFORM_SRS §11), 브라우저 종단간은 그 계층을 가장 많이
# 지나는 표면이다.
#
# **darwin 은 여기서 돌지 않는다** (D-7). 개발 호스트가 macOS 이고 전량을 밀기
# 전에 그 자리에서 돌린다 — 같은 것을 러너에서 한 번 더 돌리는 값이 없다. 러너가
# 덮는 것은 **사람이 손으로 볼 수 없는 두 OS** 다.

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

# 새 푸시는 같은 ref 의 이전 실행을 끊는다 (E2E_PARALLEL_SRS FR-EPL-10 / D-8).
# 고치는 동안 옛 실행이 러너를 붙들고 있으면 새 실행이 큐에서 기다린다 —
# Windows 샤드가 한 시간을 쓰던 회차에서 그것이 그대로 대기 시간이 되었다.
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    # OS × 샤드. OS 마다 job 을 따로 적으면 스텝이 두 벌이 되고, 두 벌이면 한쪽만
    # 고쳐진다 (FR-E2I-1 의 선례) — 그래서 매트릭스다 (D-2).
    #
    # 샤드로 가르는 이유는 그대로다. `playwright.config.ts` 는 `workers: 1` ·
    # `fullyParallel: false` 이고 그것은 바꿀 수 없다 — 테스트 전부가 **서버
    # 인스턴스 하나**를 공유하고, fixtures 가 매 테스트 앞에서 워크스페이스를
    # 비운다 (E2E_QUIESCENCE_SRS). 한 러너 안에서 못 나누는 대신 러너를 나눈다.
    #
    # `fail-fast: false` 는 규약이다 (D-3). 한 OS 의 실패로 나머지를 끊으면 고칠
    # 때마다 한 OS 씩만 보이게 된다 — 두 OS 의 실패 목록을 한 번에 받아야 한다.
    #
    # 샤드가 8인 것은 Windows 의 실측이다 (D-8). 그 OS 는 셸(pwsh) 기동이 느려
    # 항목당 시간이 macOS 의 몇 배이고, 4샤드로는 한 샤드가 상한 안에 끝나지
    # 않았다. 나누는 값은 러너 수뿐이므로 ubuntu 도 같은 수로 둔다 — OS 마다
    # 다른 수를 쓰면 `--shard=n/N` 의 N 이 두 벌이 되고, 그것이 D-2 가 막으려던
    # 바로 그 모양이다.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    runs-on: ${{ matrix.os }}
    # 로컬(macOS) 실측이 전체 25분이므로 샤드 하나는 그 1/8 이지만, 러너는 그보다
    # 느리고 `retries: 2` 가 실패 항목마다 두 번을 더 돈다 (FR-CEM-6).
    #
    # 60분인 것은 Windows 의 실측 때문이다 — 4샤드 시절 한 샤드가 23분에 74항목만
    # 지났다. 샤드를 8로 늘려 몫을 절반으로 줄였지만, 그 OS 는 셸 기동이 느려
    # 여유가 필요하다.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v6
        with:
          node-version: 22

      # 픽스처가 만드는 저장소의 전제다 (FR-CEM-5).
      #
      # `git_fixture.sh` 는 `reset --hard main` 을 쓴다 — 개발 호스트에는
      # `init.defaultBranch=main` 이 있어 그냥 통과하지만, 러너의 기본은 `master`
      # 라 그대로 두면 git 스펙이 통째로 무너진다.
      # 이름·메일은 스펙 대부분이 저장소마다 직접 세우지만, 세우지 않는 자리가
      # 하나라도 있으면 `commit` 이 거기서 멈춘다 — 전역에 두는 편이 싸다.
      #
      # `shell: bash` 는 windows 러너에서도 같은 한 벌을 쓰기 위한 것이다.
      - name: git 기본값
        shell: bash
        run: |
          git config --global init.defaultBranch main
          git config --global user.name  'dongminal e2e'
          git config --global user.email 'e2e@example.invalid'

      - name: 의존
        run: npm ci

      - name: 브라우저
        run: npx playwright install --with-deps chromium

      # `globalSetup` 이 서버 바이너리를 만든다 (E2E_PARALLEL_SRS FR-EPL-8).
      # 그 컴파일을 러너의 빈 캐시로 하면 첫 워커가 그만큼 늦게 뜨므로, 여기서
      # 한 번 돌려 캐시를 데운다.
      - name: 빌드 캐시 예열
        run: go build ./cmd/dongminal

      # 리포터를 둘 세운다. `html` 은 실패 시 올리는 artifact 의 것이고, `line` 은
      # **로그에 남는 것**이다 — html 만 두면 job 로그에 서버 로그만 남아, 무엇이
      # 몇 개 실패했는지 로그만 보고는 알 수 없다 (Windows 1차 실행에서 실측).
      # 러너 **안**은 워커가 나눈다 (E2E_PARALLEL_SRS FR-EPL-7·11). 워커마다 자기
      # 서버·자기 인스턴스 홈·자기 포트를 갖는다 — 샤드를 더 늘리는 것은 러너의
      # 셋업 비용을 반복하지만 워커는 그러지 않는다.
      - name: e2e (샤드 ${{ matrix.shard }}/8)
        run: npx playwright test --shard=${{ matrix.shard }}/8 --reporter=line,html

      # 실패했을 때만 남긴다. 초록인 실행의 리포트는 아무도 열지 않는다.
      # 이름에 OS 가 들어가는 것은 규약이다 (D-6) — 샤드 번호만 쓰면 두 OS 가 같은
      # 이름을 올리고, `upload-artifact@v4` 는 같은 이름을 두 번 받지 않는다.
      - name: 리포트 (실패 시)
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report-${{ matrix.os }}-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

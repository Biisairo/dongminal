name: release

# 태그를 밀면 다섯 대상의 바이너리를 만들어 GitHub Releases 에 첨부한다.
# 받는 사람은 자기 OS 것 **하나만** 내려받아 바로 실행한다 — 이 프로그램은
# 의존이 없는 단일 정적 바이너리이고 프론트엔드까지 rust-embed 로 들어 있다.
#
# 바이너리를 저장소에 커밋하지 않는 이유는 실측이다: 5종 합계 69MB 이고 git 은
# 모든 판을 영구히 보관하며 바이너리는 델타 압축이 먹지 않는다 (RELEASE_SRS §2.1).
# 릴리스 애셋은 git object 가 아니라 저장소 밖에 놓인다.
#
# **대상마다 그 OS 의 러너에서 원생 빌드한다** (GO_REMOVAL_SRS Q-GRM-2). Rust 는 대상의
# C 툴체인·링커가 있어야 빌드된다(ring 의 C 코드) — darwin 은 macOS 러너, linux 는 같은
# 아키텍처의 ubuntu 러너에서 musl 정적 링크(Q-GRM-1), windows 는 windows 러너다.
# 새 교차 빌드 도구를 들이지 않는다 (C-GRM-4).
#
# 릴리스 빌드는 cargo 캐시를 쓰지 않는다 — 산출물이 캐시의 내용에 기대지 않게 한다.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: '새길 판 (예: v1.0.0). 태그 없이 시험할 때만 쓴다'
        required: true

permissions:
  contents: write
  # SEC-31: cosign 의 keyless 서명이 OIDC 토큰으로 정체를 증명한다.
  # 열쇠를 저장소에 두지 않는다 — 둘 곳이 없고, 두면 그것이 곧 유출면이다.
  id-token: write
  # provenance(SLSA) 증명서를 레지스트리가 아니라 릴리스에 붙이기 위한 것.
  attestations: write

jobs:
  # ── 게이트 ────────────────────────────────────────────────────────
  #
  # 애셋을 올리기 전에 **세 OS 에서** 통과해야 한다. 상시 CI 에 macOS 를 넣지
  # 않는다는 결정은 매 푸시에 대한 것이고, 릴리스는 드물면서 darwin 바이너리를
  # 실제로 배포하는 순간이다 (FR-RGT-2).
  #
  # FR-RGT-4: 태그가 가리키는 커밋의 메시지에 `[skip tests]` 가 있으면 건너뛴다. 그러면
  # `e2e-gate` 도 따라 건너뛰고, 빌드·발행은 `!failure()` 로 계속 돈다.
  gate:
    if: ${{ !contains(github.event.head_commit.message, '[skip tests]') }}
    strategy:
      fail-fast: true
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: ./.github/actions/rust
        with:
          cache-key: release-gate

      # Go 판의 `go build`·`go vet`·`go test -race -shuffle=on` 자리다 (DIFF-GRM-5).
      - name: build · vet · 단위 테스트
        shell: bash
        run: |
          set -euo pipefail
          cargo build --workspace --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked

      - name: doctor (플랫폼 계층)
        run: cargo run --locked -q -p otterminal -- doctor

      - name: verify (종단간 22항목)
        run: cargo run --locked -q -p otterminal -- verify

  # ── 빌드 ──────────────────────────────────────────────────────────
  #
  # 반드시 scripts/build.sh 를 거친다. 워크플로우가 cargo build 를 직접 부르면
  # 대상 매핑·재현 빌드·각인·이름 규칙이 두 벌이 되고, 두 벌이면 한쪽만 고쳐진다 (FR-RWF-4).
  build-darwin:
    needs: gate
    if: ${{ !failure() && !cancelled() }}
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: ./.github/actions/rust
        with:
          targets: aarch64-apple-darwin x86_64-apple-darwin
          cache: 'false'

      - name: darwin arm64 · amd64
        env:
          VERSION: ${{ github.event.inputs.version || github.ref_name }}
        run: |
          set -euo pipefail
          scripts/build.sh --os darwin --arch arm64 | tee build.log
          scripts/build.sh --os darwin --arch amd64 | tee -a build.log
          # build.sh 가 지표가 빠진 빌드를 경고(⚠)로 알리면 실패로 승격시킨다 (FR-RWF-5).
          # Rust 판의 darwin 빌드는 늘 mach 를 부르므로 걸릴 일이 없지만, 경고가 다시
          # 생기면 조용히 나가지 않게 검사는 남긴다 (GO_REMOVAL_SRS G-47).
          if grep -q '⚠' build.log; then
            echo "::error::darwin 빌드가 경고를 냈습니다. CPU·메모리 지표가 빠질 수 있습니다."
            exit 1
          fi

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: dist-darwin
          path: dist/
          if-no-files-found: error

  # linux 둘·windows 하나. Go 판은 ubuntu 한 러너에서 셋을 교차 빌드했지만, Rust 는 대상의
  # C 툴체인이 필요해 대상 OS·아키텍처의 러너로 나눈다 (Q-GRM-2). 산출물은 아래 `build-others`
  # 가 `dist-others` 하나로 모은다 — 발행이 보는 아티팩트 이름과 파일 이름은 Go 판 그대로다.
  build-linux:
    needs: gate
    if: ${{ !failure() && !cancelled() }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-latest, triple: x86_64-unknown-linux-musl }
          - { arch: arm64, runner: ubuntu-24.04-arm, triple: aarch64-unknown-linux-musl }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: ./.github/actions/rust
        with:
          targets: ${{ matrix.triple }}
          cache: 'false'

      # musl-gcc — ring 의 C 코드를 musl 로 컴파일한다 (build.sh 가 있으면 쓴다).
      - name: musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: linux ${{ matrix.arch }}
        env:
          VERSION: ${{ github.event.inputs.version || github.ref_name }}
        run: |
          set -euo pipefail
          scripts/build.sh --os linux --arch ${{ matrix.arch }}
          # Q-GRM-1: Go 판처럼 의존이 없는 정적 바이너리여야 한다. 릴리스 노트가 그렇게 말한다.
          out=dist/otterminal-linux-${{ matrix.arch }}
          file "$out"
          if ! file "$out" | grep -Eq 'statically linked|static-pie linked'; then
            echo "::error::$out 이 정적 링크가 아닙니다."
            exit 1
          fi

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: dist-others-linux-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error

  build-windows:
    needs: gate
    if: ${{ !failure() && !cancelled() }}
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      # Git for Windows 의 기본값(core.autocrlf=true)은 체크아웃을 CRLF 로 바꾼다. 그러면
      # 바이너리에 담는 웹 자산·문구가 Go 판(ubuntu 에서 교차 빌드, LF)과 바이트가 달라진다.
      - name: 줄바꿈 보존
        run: git config --global core.autocrlf false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: ./.github/actions/rust
        with:
          targets: x86_64-pc-windows-msvc
          cache: 'false'

      - name: windows amd64
        shell: bash
        env:
          VERSION: ${{ github.event.inputs.version || github.ref_name }}
        run: |
          set -euo pipefail
          scripts/build.sh --os windows --arch amd64

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: dist-others-windows-amd64
          path: dist/
          if-no-files-found: error

  build-others:
    needs: [build-linux, build-windows]
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: linux amd64 · arm64 · windows amd64 → dist-others
        uses: actions/upload-artifact/merge@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: dist-others
          pattern: dist-others-*
          delete-merged: true

  # ── e2e 게이트 ────────────────────────────────────────────────────
  #
  # 07-production-gap `G3-5`: **발행이 브라우저 종단간을 기다리지 않았다.**
  #
  # `e2e.yml` 은 `tags: ['v*']` 에서 함께 돌지만 별도 워크플로우라 이 워크플로우의
  # 발행과 아무 관계가 없었다 — e2e 가 빨간 채로 릴리스가 나갈 수 있었고, 그
  # 상태를 아무것도 막지 않았다.
  #
  # 여기서 그 실행을 기다린다. 같은 커밋의 `e2e` 워크플로우가 끝날 때까지 폴링
  # 하고, 성공이 아니면 멈춘다.
  #
  # **왜 e2e 잡을 여기로 복사하지 않는가**: 그러면 매트릭스 16개가 두 벌이 되고,
  # 두 벌이면 한쪽만 고쳐진다 (FR-E2I-1 의 선례가 정확히 그것이다).
  e2e-gate:
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: e2e 워크플로우의 결과를 기다린다
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          echo "커밋 $SHA 의 e2e 실행을 찾는다"
          for i in $(seq 1 150); do   # 30초 × 150 = 75분
            json=$(gh api "repos/${{ github.repository }}/actions/workflows/e2e.yml/runs?head_sha=$SHA&per_page=1" \
                     --jq '.workflow_runs[0] | "\(.status) \(.conclusion) \(.html_url)"' 2>/dev/null || echo "none")
            case "$json" in
              none|"null null "*|"")
                echo "  아직 실행이 없다 ($i)";;
              completed\ success*)
                echo "e2e 성공 — ${json#* * }"; exit 0;;
              completed\ skipped*)
                # e2e.yml 의 잡을 건너뛰게 해 두었다 (2026-11-04 사용자 결정).
                echo "e2e 건너뜀 — ${json#* * }"; exit 0;;
              completed*)
                echo "::error::e2e 가 성공하지 않았습니다 — $json"; exit 1;;
              *)
                echo "  $json ($i)";;
            esac
            sleep 30
          done
          echo "::error::e2e 결과를 75분 안에 받지 못했습니다."
          exit 1

  # ── 발행 ──────────────────────────────────────────────────────────
  #
  # 두 빌드 잡 **모두** 를 기다린다. 절반만 올라간 릴리스가 가장 나쁘다
  # (FR-RGT-3). 그리고 `e2e-gate` — 브라우저 종단간이 빨간 판은 나가지 않는다
  # (`G3-5`).
  publish:
    needs: [build-darwin, build-others, e2e-gate]
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          path: staging

      - name: 애셋 모으기 · 체크섬
        id: collect
        run: |
          set -euo pipefail
          mkdir -p dist
          find staging -type f -exec mv {} dist/ \;
          cd dist
          # 다섯 대상이 모두 있어야 한다. 하나라도 빠지면 멈춘다.
          expected=(otterminal-darwin-arm64 otterminal-darwin-amd64 \
                    otterminal-linux-amd64 otterminal-linux-arm64 \
                    otterminal-windows-amd64.exe)
          for f in "${expected[@]}"; do
            [[ -f "$f" ]] || { echo "::error::애셋 누락: $f"; exit 1; }
          done
          chmod +x otterminal-darwin-* otterminal-linux-*
          sha256sum "${expected[@]}" > SHA256SUMS
          echo "── 애셋"
          ls -lh
          cat SHA256SUMS

      # SEC-31 — **체크섬만으로는 부족하다.**
      #
      # `SHA256SUMS` 는 "받은 파일이 온전한가" 에만 답한다. 그 파일 자체를 바꿔
      # 놓으면 검증은 통과하고, 그래서 **누가 만들었는가**에는 아무도 답하지
      # 못했다. cosign 의 keyless 서명이 그 물음을 맡는다 — 열쇠는 없고, 서명
      # 시점의 OIDC 정체(이 워크플로우·이 저장소·이 태그)가 증거다.
      #
      # 서명 대상은 **`SHA256SUMS` 하나**다. 그것이 나머지 전부를 이미 묶고
      # 있으므로, 다섯을 따로 서명하면 검증 절차만 다섯 배가 되고 얻는 것이 없다.
      - name: cosign 설치
        uses: sigstore/cosign-installer@d58896d6a1865668819e1d91763c7751a165e159 # v3.9.2

      - name: 체크섬 서명 (keyless)
        env:
          COSIGN_YES: "true"
        run: |
          set -euo pipefail
          cd dist
          cosign sign-blob SHA256SUMS \
            --output-signature SHA256SUMS.sig \
            --output-certificate SHA256SUMS.pem
          echo "── 서명 산출물"
          ls -l SHA256SUMS.sig SHA256SUMS.pem

      # 빌드 출처(provenance) 증명. 서명이 "누가" 라면 이쪽은 "무엇으로부터" 다 —
      # 어떤 커밋의 어떤 워크플로우가 이 바이트를 만들었는지.
      - name: provenance 증명
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-path: dist/SHA256SUMS

      - name: 릴리스 생성
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.event.inputs.version || github.ref_name }}
        run: |
          set -euo pipefail
          # 이 판에서 무엇이 바뀌었는지를 **CHANGELOG 에서 그대로 가져온다.**
          # 손으로 옮겨 적으면 두 벌이 되고, 두 벌이면 한쪽만 고쳐진다.
          # 해당 절이 없으면(태그만 밀고 CHANGELOG 를 잊은 경우) 비운 채 넘어간다 —
          # 릴리스를 막을 일은 아니지만, 빈 것이 보이면 다음에 챙기게 된다.
          ver="${VERSION#v}"
          awk -v v="$ver" '
            $0 ~ "^## \\[" v "\\]" {on=1; next}
            on && /^## \[/ {exit}
            on {print}
          ' CHANGELOG.md > changes.md || true
          if [[ ! -s changes.md ]]; then
            echo "::warning::CHANGELOG.md 에 [$ver] 절이 없습니다 — 변경 내용 없이 발행합니다."
          fi

          # 받는 사람이 페이지를 벗어나지 않고 명령을 복사할 수 있어야 한다
          # (FR-RWF-7).
          cat > notes.md <<EOF
          단일 바이너리입니다. 받아서 실행하면 끝이고, 런타임 의존이 필요 없습니다 —
          프론트엔드와 런타임 헬퍼까지 안에 들어 있습니다.

          ## 설치

          **macOS (Apple Silicon)**
          \`\`\`bash
          curl -fL -o otterminal https://github.com/${{ github.repository }}/releases/download/$VERSION/otterminal-darwin-arm64
          chmod +x otterminal && xattr -d com.apple.quarantine otterminal
          ./otterminal start
          ./otterminal window
          \`\`\`

          **macOS (Intel)** — 위에서 \`darwin-arm64\` 를 \`darwin-amd64\` 로.

          **Linux / WSL**
          \`\`\`bash
          curl -fL -o otterminal https://github.com/${{ github.repository }}/releases/download/$VERSION/otterminal-linux-amd64
          chmod +x otterminal
          ./otterminal start
          \`\`\`

          **Windows 10 1809+** (PowerShell)
          \`\`\`powershell
          curl.exe -fL -o otterminal.exe https://github.com/${{ github.repository }}/releases/download/$VERSION/otterminal-windows-amd64.exe
          .\\otterminal.exe start
          .\\otterminal.exe window
          \`\`\`

          브라우저에서 \`http://localhost:58146/\` 로 접속합니다.
          \`./otterminal\` 을 인자 없이 실행하면 도움말이, \`./otterminal version\` 이 판을 냅니다.

          ## 확인

          받은 파일이 **온전한지**:

          \`\`\`bash
          curl -fLO https://github.com/${{ github.repository }}/releases/download/$VERSION/SHA256SUMS
          sha256sum -c SHA256SUMS --ignore-missing
          \`\`\`

          그 \`SHA256SUMS\` 를 **누가 만들었는지** (SEC-31). 위의 확인은 체크섬
          파일 자체가 바뀌었으면 통과합니다 — 이쪽이 그 물음에 답합니다.
          [cosign](https://github.com/sigstore/cosign) 이 필요합니다:

          \`\`\`bash
          curl -fLO https://github.com/${{ github.repository }}/releases/download/$VERSION/SHA256SUMS.sig
          curl -fLO https://github.com/${{ github.repository }}/releases/download/$VERSION/SHA256SUMS.pem

          cosign verify-blob SHA256SUMS \\
            --signature SHA256SUMS.sig \\
            --certificate SHA256SUMS.pem \\
            --certificate-identity-regexp '^https://github.com/${{ github.repository }}/' \\
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          \`\`\`

          열쇠는 없습니다. 서명 시점의 OIDC 정체(이 저장소·이 워크플로우·이
          태그)가 증거이고, 그 기록은 공개 투명성 로그에 남습니다.

          ## 대상

          | 파일 | 대상 |
          |---|---|
          | \`otterminal-darwin-arm64\` | macOS Apple Silicon |
          | \`otterminal-darwin-amd64\` | macOS Intel |
          | \`otterminal-linux-amd64\` | Linux x86_64 · WSL |
          | \`otterminal-linux-arm64\` | Linux ARM64 |
          | \`otterminal-windows-amd64.exe\` | Windows 10 1809+ |

          macOS 산출물은 코드 서명·공증을 하지 않았습니다. 위 \`xattr\` 한 줄이 그래서 필요합니다.
          EOF

          # 변경 내용은 설치 안내 **앞**에 온다 — 이미 쓰고 있는 사람에게는 그것이
          # 이 페이지를 여는 이유이고, 처음 받는 사람은 그 아래를 그대로 따라가면 된다.
          if [[ -s changes.md ]]; then
            { echo "## 이 판에서 바뀐 것"; echo; cat changes.md; echo; echo "---"; echo; cat notes.md; } > full.md
            mv full.md notes.md
          fi

          gh release create "$VERSION" dist/* \
            --repo "${{ github.repository }}" \
            --title "$VERSION" \
            --notes-file notes.md
